# Runs the reconciliation regression suite. The suite works on synthetic fixtures only and downloads nothing:
# the source documents are fetched by ./run.sh, not here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the packages the suite imports
        run: python -m pip install openpyxl pdfplumber
      - name: Regression suite
        run: python -m unittest tests/test_reconciliation.py
