# Runs the reconciliation regression suite. The suite works on synthetic fixtures and the source documents committed
# in the repository (AER files, Wayback copies) and downloads nothing: the other documents are fetched by ./run.sh.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the packages the suite imports
        run: python -m pip install openpyxl pdfplumber
      - name: Regression suite
        run: python -m unittest tests/test_reconciliation.py
      - name: Release check parsing (offline)
        run: python -m unittest tests/test_check_releases.py

  tariffdb:
    # The tariff database tests: generated files current, constraints, validation rules, the build rules on synthetic
    # documents, and every value and quote re-read from the source documents committed in the repository (the other
    # documents are fetched by ./run.sh, so TARIFFDB_SOURCES=committed limits the re-reads to those files).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the packages the suite imports
        run: python -m pip install openpyxl pdfplumber pyyaml rapidocr_onnxruntime
      - name: Tariff database suite
        run: python -m unittest tests/test_tariffdb.py
        env:
          TARIFFDB_SOURCES: committed
