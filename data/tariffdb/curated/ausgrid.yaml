charge_rules:
- codes: [EA302, EA316]
  doc: sources/archive/ausgrid/2016-17/ES7.pdf
  fin_year: [2016-17, 2017-18]
  charge_type: capacity
  measure: kW
  interval_min: 30
  method: max
  reset: rolling_12_months
  locator: pdf:p13
  quote: A capacity charge is a price applied (in cents per kW or kVA per day) to the maximum half hourly kW or kVA demand
    reading2 that occurred in the peak period (that is, between 2pm and 8pm on a working weekday) at a customer’s connection
    point over the billing periods that relate to the previous 12 months including the current billing period.
  note: ES7 3.7.2; kW or kVA as the price list prices the capacity charge (c/kW/day or c/kVA/day).
- codes: [EA305, EA310, EA317, EA325, EA360, EA370, EA380, EA390, EA391]
