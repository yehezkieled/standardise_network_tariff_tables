distributor: ausgrid
tou_schedules:
- id: ausgrid-2024-25-ea958-tou
  doc: sources/dnsp/ausgrid/Ausgrid_Network_Price_List_2024-25_wayback20250806.pdf
  fin_year: 2024-25
  name: EA958 Super off-peak trial charging windows
  time_basis: not_stated
  public_holidays: unchanged
  covers_full_day: true
  locator: pdf:p3
  quote: '*The charging windows for EA958 differ from the standard network charging windows. The off-peak (branded ‘super
    off-peak’) applies from midnight to 6am every day. The peak applies to all other times.'
  note: Windows apply 'every day', so public holidays are not treated differently. The standard network charging windows referred
    to are not given in this price list.
  windows:
  - period: off_peak
    label: off-peak (branded 'super off-peak')
    days: all_days
    start: 00:00
    end: 06:00
  - period: peak
    label: peak
    days: all_days
    start: 06:00
    end: '24:00'
  tariffs:
  - codes: [EA958]
    applies_to: energy
- id: ausgrid-2023-24-low-season-demand-window
  doc: sources/aer/2023-24_price_lists/Ausgrid_2023-24_annual_SCS_pricing_proposal_31Mar2023.pdf
  fin_year: 2023-24
  name: Low season demand window (residential and small business demand tariffs)
  time_basis: not_stated
  public_holidays: not_stated
  covers_full_day: false
  locator: pdf:p27
  quote: In other months (‘low season’) where the peak energy price does not apply, residential and small business charging
    windows are aligned with the capacity charging windows for larger businesses (2-8 pm working weekdays).
  note: 'Section 10.7. Section 10.3 (p25) says the same: ''In seasons where there is no peak energy on working weekdays, a
    window of 2-8 pm applies for low season demand charging''. The months of the low season and the summer/winter peak energy
    windows (which are the high-season demand windows) are not given in this document; it refers to the TSS and the ES7 Network
    Price Guide.'
  windows:
  - period: demand_window
    label: low season demand window (2-8 pm working weekdays)
    days: business_day
    start: '14:00'
    end: '20:00'
    season: low season
  tariffs:
  - codes: [EA111, EA115, EA116, EA251, EA255, EA256]
    applies_to: demand
    locator: pdf:p25
    quote: From 1 July 2019, we introduced demand tariffs for residential and small business customers.
    note: Residential and small business demand tariffs with high season / low season demand charges in Table 4.1.
- id: ausgrid-2023-24-larger-business-capacity-window
  doc: sources/aer/2023-24_price_lists/Ausgrid_2023-24_annual_SCS_pricing_proposal_31Mar2023.pdf
  fin_year: 2023-24
  name: Capacity charging window for larger businesses (2-8 pm working weekdays)
  time_basis: not_stated
  public_holidays: not_stated
  covers_full_day: false
  locator: pdf:p27
  quote: the capacity charging windows for larger businesses (2-8 pm working weekdays)
  note: Section 10.7; the same wording is in the Section 2.1 key reforms list (p6). 'Working weekdays' is recorded as business_day.
    The document does not list which codes are 'larger businesses'; the linked codes are the tariffs Table 4.1 (p12) prices
    under the 'Capacity charge - Peak' heading (EA302/EA316 in c/kW/day, the rest in c/kVA/day). EA501 (Transmission-connected)
    also carries a capacity charge there but is not a business tariff class, so it is not linked.
  windows:
  - period: demand_window
    label: capacity charging window (2-8 pm working weekdays)
    days: business_day
    start: '14:00'
    end: '20:00'
  tariffs:
  - codes: [EA302, EA305, EA310, EA316, EA317, EA325, EA360, EA370, EA380, EA390, EA391]
    applies_to: demand
    locator: pdf:p12
    quote: c/kW/day c/kW/day c/kW/day c/kVA/day
    note: 'Table 4.1 unit row; these codes have a value in the last two columns (''Capacity charge'' heading: Peak c/kW/day
      for EA302/EA316, Peak c/kVA/day for the others).'
demand_rules:
- id: ausgrid-2023-24-demand-kw-low-season
  doc: sources/aer/2023-24_price_lists/Ausgrid_2023-24_annual_SCS_pricing_proposal_31Mar2023.pdf
  fin_year: 2023-24
  measure: kW
  interval_minutes: 30
  aggregation: monthly_max
  window_schedule: ausgrid-2023-24-low-season-demand-window
  window_period: demand_window
  locator: pdf:p25
  quote: The demand measure is the maximum energy consumption recorded over any 30-minute period within the defined seasonal
    demand window on a working weekday in each month (measured in kW).
  note: 'Low season demand charge. The next sentence: ''The resulting demand charge applies for each day in the month (before
    being reset for the next month)''. Window: ''In seasons where there is no peak energy on working weekdays, a window of
    2-8 pm applies for low season demand charging'' (same page).'
  tariffs:
  - codes: &id001 [EA111, EA115, EA116, EA251, EA255, EA256]
    season: low
- id: ausgrid-2023-24-demand-kw-high-season
  doc: sources/aer/2023-24_price_lists/Ausgrid_2023-24_annual_SCS_pricing_proposal_31Mar2023.pdf
  fin_year: 2023-24
  measure: kW
  interval_minutes: 30
  aggregation: monthly_max
  locator: pdf:p25
  quote: The demand measure is the maximum energy consumption recorded over any 30-minute period within the defined seasonal
    demand window on a working weekday in each month (measured in kW).
  note: 'High season demand charge. Window: ''The demand window for measuring the maximum demand is aligned with a corresponding
    TOU peak energy window'' (same page); the peak energy windows and high-season months are not given in this document (it
    refers to TSS Section 3.1 and the ES7 Network Price Guide), so no window is linked.'
  tariffs:
  - codes: *id001
    season: high
- id: ausgrid-2023-24-capacity-kw
  doc: sources/aer/2023-24_price_lists/Ausgrid_2023-24_annual_SCS_pricing_proposal_31Mar2023.pdf
  fin_year: 2023-24
  measure: kW
  aggregation: not_stated
  window_schedule: ausgrid-2023-24-larger-business-capacity-window
  window_period: demand_window
  locator: pdf:p26
  quote: we introduced capacity charges for the transitional tariffs EA316 (in kW) and EA317 (in kVA) effective from 1 July
    2021
  note: EA302 is linked because Table 4.1 (p12) prices EA302 and EA316 identically in the Peak c/kW/day column under the 'Capacity
    charge' heading ('c/kW/day c/kW/day c/kW/day c/kVA/day'). Measurement interval and aggregation are not stated; the window
    is the 'capacity charging windows for larger businesses (2-8 pm working weekdays)' (p27).
  tariffs:
  - codes: [EA302, EA316]
    time_band: peak
