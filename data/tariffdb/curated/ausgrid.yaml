  measure: kVA
  aggregation: not_stated
  window_schedule: ausgrid-2023-24-larger-business-capacity-window
  window_period: demand_window
  locator: pdf:p12
  quote: c/kW/day c/kW/day c/kW/day c/kVA/day
  note: 'Table 4.1 unit row: the last column (''Capacity charge - Peak'') is c/kVA/day; these codes are priced in it. Section
    10.6 (p26) also says EA317''s capacity charge is ''in kVA''. Interval and aggregation are not stated; window per p27 (''capacity
    charging windows for larger businesses (2-8 pm working weekdays)'').'
  tariffs:
  - codes: [EA305, EA310, EA317, EA325, EA360, EA370, EA380, EA390, EA391]
    time_band: peak
