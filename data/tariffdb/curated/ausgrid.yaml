  locator: pdf:p23
  quote: The demand measure is the maximum energy consumption recorded over any 30-minute period within the defined seasonal
    demand window on a working weekday in each month (measured in kW). The resulting demand charge applies for each day in
    the month (before being reset for the next month)
  note: The residential and small business demand tariffs section of the 2022-23 pricing proposal; the same wording as the
    2023-24 rule. Holds for both seasons' demand rates. Only working weekdays count, which the demand windows carry as business_day.
- codes: [EA111, EA115, EA116, EA251, EA255, EA256]
  doc: sources/aer/2023-24_price_lists/Ausgrid_2023-24_annual_SCS_pricing_proposal_31Mar2023.pdf
  fin_year: 2023-24
  charge_type: demand
  measure: kW
  interval_min: 30
  method: max
  reset: month
  locator: pdf:p25
  quote: Each demand tariff consists of a fixed daily charge (in cents per day), an energy consumption charge (in cents per
    kWh) with a seasonal TOU structure, and a seasonal demand charge (in cents per kW per day). The demand measure is the
    maximum energy consumption recorded over any 30-minute period within the defined seasonal demand window on a working
    weekday in each month (measured in kW). The resulting demand charge applies for each day in the month (before being
    reset for the next month)
  note: Section 10.3, which introduces these as the demand tariffs for residential and small business customers; the codes
    are the ones Table 4.1 (p12) prices in the 'Demand charge' High season and Low season c/kW/day columns. Holds for both
    seasons' demand rates. Only working weekdays count, which the demand windows carry as business_day.
