  quote: HV storage EA374 Fixed cents / day Access charge reflecting a fixed amount per tariff (import) day Off-peak cents / kWh
    Charge applied to energy consumed outside energy critical peak periods Critical peak cents / kWh Charge applied during
    critical maximum energy demand events
