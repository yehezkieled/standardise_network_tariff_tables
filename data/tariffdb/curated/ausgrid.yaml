- codes: [EA029]
  doc: sources/dnsp/ausgrid/Ausgrid_ES7_Network_Price_Guide_2024-25_July2024_wayback.pdf
  fin_year: 2024-25
  charge_type: export
  tou_period: solar_soak
  measure: kWh
  method: sum
  reset: billing_period
  allowance_per_day: 6.85
  allowance_rollover: true
  locator: pdf:p17
  quote: The charge component includes a free threshold where part of the total exported energy in a billing period is exempt
    from receiving a charge. The amount of the free threshold is 6.85
  note: Section 3.6; the sentence continues on p18 'kWh per number of days in the billing period', and p18 lists the monthly
    amounts (212.4 kWh for 31 day months ...). The threshold is part of the charge component, which applies between 10am and
    3pm (p17); it is pooled over the billing period, so an unused daily allowance rolls over within it.
- codes: [EA029]
  doc: sources/dnsp/ausgrid/Ausgrid_ES7_Network_Price_Guide_2025-26_July2025_wayback.pdf
  fin_year: 2025-26
  charge_type: export
  tou_period: solar_soak
  measure: kWh
  method: sum
  reset: billing_period
  allowance_per_day: 6.85
  allowance_rollover: true
  locator: pdf:p17
  quote: The charge component includes a free threshold where part of the total exported energy in a billing period is exempt
    from receiving a charge. The amount of the free threshold is 6.85 kWh per number of days in the billing period.
  note: Section 3.6. The threshold is part of the charge component, which applies between 10am and 3pm; it is pooled over
    the billing period (the daily amount times its days), so an unused daily allowance rolls over within it.
- codes: [EA029]
  doc: sources/dnsp/ausgrid/Ausgrid_ES7_Network_Price_Guide_2026-27_July2026.pdf
  fin_year: 2026-27
  charge_type: export
  tou_period: solar_soak
  measure: kWh
  method: sum
  reset: billing_period
  allowance_per_day: 6.85
  allowance_rollover: true
  locator: pdf:p19
  quote: The charge component includes a free threshold (defined in the TSS as the Basic Export Level or BEL) where part of
    the total exported energy in a billing period is exempt from receiving a charge. The free threshold is 6.85 kWh per day
    multiplied by the number of days in the relevant billing period.
  note: Section 3.6. The threshold is part of the charge component, which applies between 10am and 3pm; it is pooled over
    the billing period (the daily amount times its days), so an unused daily allowance rolls over within it.
