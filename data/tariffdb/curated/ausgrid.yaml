- codes: [EA111, EA115, EA116, EA251, EA255, EA256]
  doc: sources/archive/ausgrid/2019-20/Ausgrid_-_AER_approved_2019-20_Initial_Pricing_Proposal_-_REVISED_-_29_May_2019_-_June_2019.pdf
  fin_year: 2019-20
  charge_type: demand
  measure: kW
  interval_min: 30
  method: max
  reset: month
  locator: pdf:p21
  quote: The demand measure is the maximum energy consumption recorded over any 30-minute period within the defined seasonal
    demand window on a working weekday in each month (measured in kW). The resulting demand charge applies for each day in
    the month (before being reset for the next month)
  note: The residential and small business demand tariffs section of the 2019-20 pricing proposal; the same wording as the
    2023-24 rule. Holds for both seasons' demand rates. Only working weekdays count, which the demand windows carry as business_day.
