- codes: [NEN56, NSP56, NSP75, NSP76, NSP77, NSP78]
  doc: sources/archive/ausnet/2017/Annual_Tariff_Report_2017.pdf
  fin_year: "2017"
  charge_type: capacity
  measure: kVA
  method: assigned
  reset: year
  locator: "pdf:p45"
  quote: "1. Low Voltage Capacity charge based on the nameplate rating of the Charge transformer supplying the customer’s installation."
  note: "The year's annual tariff report, section 5.7 'Capacity & Critical Peak Tariffs' (p45): for the low voltage CPD tariffs the capacity is a value AusNet assigns from the connection's rating, not a measurement. Reset year only marks the annual ($/kVA/yr) price; the value does not reset."
- codes: [NSP81, NSP82, NSP83, NSP91, NSP94, NSP95]
  doc: sources/archive/ausnet/2017/Annual_Tariff_Report_2017.pdf
  fin_year: "2017"
  charge_type: capacity
  measure: kVA
  method: assigned
  reset: year
  locator: "pdf:p45"
  quote: "2. High Voltage & Sub transmission Capacity based on the rating of the cabling and switchgear that makes the customer connection point."
  note: "The year's annual tariff report, section 5.7 'Capacity & Critical Peak Tariffs' (p45): for the high voltage and sub-transmission CPD tariffs the capacity is a value AusNet assigns from the connection's rating, not a measurement. Reset year only marks the annual ($/kVA/yr) price; the value does not reset."
- codes: [NEN56, NSP56, NSP75, NSP76, NSP77, NSP78, NSP81, NSP82, NSP83, NSP91, NSP94, NSP95]
  doc: sources/archive/ausnet/2017/Annual_Tariff_Report_2017.pdf
  fin_year: "2017"
  charge_type: demand
  measure: kVA
  method: avg_nominated_days
  n: 5
  reset: year_from_april
  locator: "pdf:p46"
  quote: "The demand charge is based on the average of customer’s maximum kVA Demand recorded on the 5 nominated peak demand weekdays during the Defined Charge Critical Peak Demand Period. Defined Days must be during the period of December to March, and the days will be Critical Peak nominated and communicated to customers with a minimum of one business Demand day’s notice. Period The period during which the demand is to be measured is between 2pm-6pm AEST1 on the nominated day. The 5 maximum’s are averaged and used as the basis for the demand charge for the 12 month period from April to March."
  note: "The year's annual tariff report, section 5.7 'Capacity & Critical Peak Tariffs' (p46): the mean of the customer's maximum kVA on each of the 5 critical peak days AusNet nominates between December and March (2 pm to 6 pm AEST / 3 pm to 7 pm AEDT on the day), applied for the 12 months from April to March. No interval length is stated for the maximum kVA."
