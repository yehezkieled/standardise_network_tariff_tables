  doc: sources/dnsp/ausnet/AusNet_Tariff_Structure_Statement_2021-26_AER_final_decision_April2021.pdf
  fin_year: ["2021-22", "2022-23"]
  charge_type: capacity
  measure: kVA
  method: assigned
  reset: year
  locator: "pdf:p22"
  quote: "Capacity charge 1. For low voltage connections the capacity charges assigned is the nameplate rating of the transformer supplying the customer’s installation. For sites where the transformer is not dedicated to the customer installation, the charge is set by reference to the portion of the nameplate rating of the transformer that is allocated to the customer’s requirements; and 2. For high voltage and sub transmission connections, capacity is assigned according to the rating of the cabling and switchgear that makes the customer’s connection point."
  note: "Table 10 'CPD pricing structure' of the 2021-26 tariff structure statement, which applies from 2021-22 (the same table as the 2023-24 rules). The capacity is a value AusNet assigns, not a measurement: the transformer nameplate rating (or the allocated portion) for low voltage, the rating of the cabling and switchgear for high voltage and sub-transmission connections. Reset year only marks the annual price."
