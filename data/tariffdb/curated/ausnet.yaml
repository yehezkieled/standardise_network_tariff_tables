  fin_year: 2023-24
  measure: kVA
  aggregation: not_stated
  window_schedule: ausnet-2023-24-app-d-cpd
  window_period: critical_peak
  note: "Critical peak demand ($/kVA/yr): average of the maximum kVA recorded in the critical peak demand period on the nominated days; no listed aggregation fits."
  locator: "pdf:p18"
  quote: The demand charge is based on the average of the customer’s maximum kVA
  tariffs:
  - codes: &id001 [NSP56, NEN56, NSP75, NSP76, NSP77, NSP78, NSP81, NSP82, NSP83, NSP91, NSP94, NSP95]
