  quote: "Critical peak The demand charge is based on the average of the customer’s maximum kVA demand charge recorded on the 5 nominated peak demand weekdays during the defined critical peak demand period. The average is used as an input into the demand charge for the 12 month period from 1 April to 31 March."
  note: "Table 10 'CPD pricing structure' of the 2021-26 tariff structure statement, which applies from 2021-22 (the same table as the 2023-24 rules). The mean of the customer's maximum kVA on each of the 5 critical peak days AusNet nominates between December and March, applied for 1 April to 31 March. No interval length is stated for the maximum kVA."
