  quote: "Critical peak The demand charge is based on the average of the customer’s maximum kVA demand charge recorded
    on the 5 nominated peak demand weekdays during the defined critical peak demand period. The average is used as an
    input into the demand charge for the 12 month period from 1 April to 31 March."
  note: "Table 10 'CPD pricing structure': the mean of the customer's maximum kVA on each of the 5 CPD days AusNet
    nominates between December and March (2 pm to 6 pm AEST / 3 pm to 7 pm AEDT on the day, 'Defined critical peak
    demand period', same page), applied for 1 April to 31 March. No interval length is stated for the maximum kVA (the
    CPD tariffs' minimum meter integrates kWh and kVAr over 30 minutes, p15). For a supply point new to a CPD tariff,
    60% of the capacity until a value is established (not stored). The tariffs are those Table 5 (p12) names 'critical
    peak demand'."
