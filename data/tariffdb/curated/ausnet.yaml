    installation, the charge is set by reference to the portion of the nameplate rating of the transformer that is
    allocated to the customer’s requirements; and 2. For high voltage and sub transmission connections, capacity is
    assigned according to the rating of the cabling and switchgear that makes the customer’s connection point."
  note: "Table 10 'CPD pricing structure' (section 4.6; the layout text runs the 'Tariff component' cells into the
    rows). The capacity is a value AusNet assigns, not a measurement: the transformer nameplate rating (or the
    customer's allocated portion of it) for low voltage connections (NEN56, NSP56, NSP75-NSP78), the rating of the
    connection's cabling and switchgear for high voltage (NSP81-NSP83) and sub-transmission (NSP91, NSP94, NSP95)
    connections; these are the tariffs Table 5 (p12) names 'critical peak demand'. Priced in $/kVA/yr ('Capacity
    $/kVA/yr Fixed value', p14); reset year only marks the annual price, the value does not reset."
