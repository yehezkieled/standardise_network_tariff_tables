distributor: endeavour
tou_schedules:
- id: endeavour-2024-25-res-gs-tou
  doc: sources/dnsp/endeavour/Endeavour_NUOS_Price_List_2024-25_v10.pdf
  fin_year: 2024-25
  name: Residential and General Supply time of day periods (energy, demand and export)
  time_basis: local_time
  public_holidays: as_non_business_day
  covers_full_day: true
  locator: pdf:p23
  quote: 'Residential and General Supply Pricing Options: ‘Peak’, ‘Solar Soak’ and ‘Off Peak’ periods are based on the following
    time periods and apply during both Eastern Standard Time (EST) and Daylight Saving Time (DST): Business Days Peak: 16:00
    – 20:00 Solar Soak: 10:00 – 14:00 Off Peak: All other times. Non-business Days Solar Soak: 10:00 – 14:00 Off Peak: All
    other times.'
  note: 'Seasons (same page): ''High-season: November to March Low-season: April to October''; ''Demand charges apply to ‘Peak’
    periods only.'' Public holidays: section 6.2 ''The following public holidays are deemed to be non-business days''. Section
    6.7 states: ''In order to maintain the same time limits during both Eastern Standard Time (EST) and Daylight Saving Time
    (DST), billing data is adjusted by shifting the data forward an hour'', i.e. the windows are clock times in force (local
    time) all year.'
  windows:
  - period: off_peak
    label: Off Peak
    days: business_day
    start: 00:00
    end: '10:00'
  - period: solar_soak
    label: Solar Soak
    days: business_day
    start: '10:00'
    end: '14:00'
  - period: off_peak
    label: Off Peak
    days: business_day
    start: '14:00'
    end: '16:00'
  - period: peak
    label: Peak (High-season)
    days: business_day
    start: '16:00'
    end: '20:00'
    months: 11,12,1,2,3
    season: High-season
  - period: peak
    label: Peak (Low-season)
    days: business_day
    start: '16:00'
    end: '20:00'
    months: 4,5,6,7,8,9,10
    season: Low-season
  - period: off_peak
    label: Off Peak
    days: business_day
    start: '20:00'
    end: '24:00'
  - period: off_peak
    label: Off Peak
    days: non_business_day
    start: 00:00
    end: '10:00'
  - period: solar_soak
    label: Solar Soak
    days: non_business_day
    start: '10:00'
    end: '14:00'
  - period: off_peak
    label: Off Peak
    days: non_business_day
    start: '14:00'
    end: '24:00'
  tariffs:
  - codes: [N71]
    applies_to: usage
    locator: pdf:p7
    quote: Residential Seasonal TOU Tariff – N71
    note: Heading of the N71 section; the section states 'High-season Peak, Low-season Peak, Solar Soak and Off Peak energy consumption
      are calculated using the time of day definitions outlined in section 6.1.'
  - codes: [N91]
    applies_to: usage
    locator: pdf:p10
    quote: General Supply Seasonal TOU Tariff – N91
    note: Heading of the N91 section; the section states 'High-season Peak, Low-season Peak, Solar Soak and Off Peak energy consumption
      are calculated using the time of day definitions outlined in section 6.1.'
  - codes: [N72]
    applies_to: usage
    locator: pdf:p7
    quote: Residential Demand Tariff – N72
    note: Heading of the N72 section; the section states 'Solar Soak and Energy consumption, High-season and Low-season demand
      values are calculated using the time of day definitions outlined in section 6.1.' N72 has a Solar Soak energy rate and one
      energy rate for all other times.
  - codes: [N72]
    applies_to: demand
    locator: pdf:p7
    quote: Residential Demand Tariff – N72
    note: Heading of the N72 section; the section lists 'High-season and Low-season demand charges (¢/kW/day)' and 'Demand charges
      apply to Peak periods only.'
  - codes: [N73]
    applies_to: demand
    locator: pdf:p7
    quote: Residential Transitional Demand Tariff – N73
    note: Heading of the N73 section; the section lists 'High-season and Low-season demand charges (¢/kW/day)' and 'Demand charges
      apply to Peak periods only.'
  - codes: [N92]
    applies_to: demand
    locator: pdf:p10
    quote: General Supply Demand Tariff – N92
    note: Heading of the N92 section; the section lists 'High-season and Low-season demand charges (¢/kW/day)' and 'Demand charges
      apply to Peak periods only.'
  - codes: [N93]
    applies_to: demand
    locator: pdf:p11
    quote: General Supply Transitional Demand Tariff – N93
    note: Heading of the N93 section; the section lists 'High-season and Low-season demand charges (¢/kW/day)' and 'Demand charges
      apply to Peak periods only.'
  - codes: [N73]
    applies_to: usage
    locator: pdf:p7
    quote: Residential Transitional Demand Tariff – N73
    note: Heading of the N73 section; the section states 'High-season, Low-season demand and Solar Soak and Energy consumption
      are calculated using the time of day definitions outlined in section 6.1.' N73 has a Solar Soak energy rate and one energy
      rate for all other times.
  - codes: [N92]
    applies_to: usage
    locator: pdf:p10
    quote: General Supply Demand Tariff – N92
    note: Heading of the N92 section; the section states 'High-season, Low-season demand and Solar Soak and Energy consumption
      are calculated using the time of day definitions outlined in section 6.1.' N92 has a Solar Soak energy rate and one energy
      rate for all other times.
  - codes: [N93]
    applies_to: usage
    locator: pdf:p11
    quote: General Supply Transitional Demand Tariff – N93
    note: Heading of the N93 section; the section states 'High-season, Low-season demand and Solar Soak and Energy consumption
      are calculated using the time of day definitions outlined in section 6.1.' N93 has a Solar Soak energy rate and one energy
      rate for all other times.
  - codes: [N61]
    applies_to: export
    locator: pdf:p8
    quote: Prosumer – N61
    note: Heading of the N61 section under 4.1.1 Residential; the section states 'High-season Peak, Low-season Peak and Solar
      Soak energy exports are calculated using the time of day definitions outlined in section 6.1.' Export charge (block 2) in
      the Solar Soak period; export rewards in High-season and Low-season Peak.
  - codes: [N95]
    applies_to: all
    locator: pdf:p11
    quote: Low Voltage Grid Connected Storage – N95
    note: Heading of the N95 section; the section lists 'High-season Peak, Low-season Peak, Solar Soak and Off Peak energy consumption
      charges (¢/kWh)' for energy consumed from the network and states 'High-season Peak, Low-season Peak and Solar Soak energy
      exports are calculated using the time of day definitions outlined in section 6.1.' Exports are charged in Solar Soak (block
      2) and rewarded in High-/Low-season Peak.
