  - codes: [NS19, NS29, NS39]
    applies_to: all
    locator: pdf:p33
    quote: NS19 LV Demand TOU Solar (Net) N19 NESN NS29 HV Demand TOU Solar (Net) N29 NESN NS39 ST Demand TOU Solar (Net) N39
      NESN
    note: 'Table 7 maps the obsolete codes NS19/NS29/NS39 to the Large Demand tariffs N19/N29/N39. Section 4.4 Obsolete Pricing
      Options (p16): ''The energy consumption and demand charges for these Pricing Options are calculated using the time of day
      definitions outlined in section 6.1.'''
- id: endeavour-2024-25-cl1-supply
  doc: sources/dnsp/endeavour/Endeavour_NUOS_Price_List_2024-25_v10.pdf
  fin_year: 2024-25
  name: Controlled Load 1 supply window
  time_basis: local_time
  public_holidays: not_stated
  covers_full_day: false
  locator: pdf:p26
  quote: so that supply may not be available between 7:00am and 10:00pm during Eastern Standard Time (EST) and Daylight Saving
    Time (DST). Supply will be made available for selected periods between 10:00pm and 7:00am (EST and DST).
  note: 'Supply is given for selected periods within the window, not necessarily all of it. Controlled Load 2 (N54) has no stated
    window: ''electricity is available for restricted periods not exceeding a total of 17 hours in any period of 24 hours''
    (section 4.1.2).'
  windows:
  - period: controlled_load_supply
    label: selected periods between 10:00pm and 7:00am
    days: all_days
    start: '22:00'
    end: '24:00'
  - period: controlled_load_supply
    label: selected periods between 10:00pm and 7:00am
    days: all_days
    start: 00:00
    end: 07:00
  tariffs:
  - codes: [N50]
    applies_to: controlled_load
    locator: pdf:p8
    quote: Controlled Load 1 (N50) applies where supply to approved specified appliances is controlled such that supply may not
      be available between 7:00am and 10:00pm
    note: Section 4.1.2 Controlled Load; section 8.1 (the schedule quote) gives the supply hours.
  - codes: [NC01]
    applies_to: controlled_load
    locator: pdf:p32
    quote: NC01 Domestic (BT) + Controlled Load 1 N70 N50
    note: Table 7 maps this obsolete code's controlled load to N50 (Controlled Load 1).
  - codes: [NC03]
    applies_to: controlled_load
    locator: pdf:p32
    quote: NC03 General Supply BT + Controlled Load 1 N90 N50
    note: Table 7 maps this obsolete code's controlled load to N50 (Controlled Load 1).
  - codes: [NFTC]
    applies_to: controlled_load
    locator: pdf:p33
    quote: NFTC N70 N50 NESN
    note: Table 7 maps this obsolete code's controlled load to N50 (Controlled Load 1).
  - codes: [NFTE]
    applies_to: controlled_load
    locator: pdf:p33
    quote: NFTE N90 N50 NESN
    note: Table 7 maps this obsolete code's controlled load to N50 (Controlled Load 1).
