- codes: ['7200']
  doc: sources/dnsp/energex/Energex_Network_Tariff_Guide_2023-24_wayback.pdf
  fin_year: 2023-24
  charge_type: demand
  tou_period: peak
  measure: kVA
  interval_min: 30
  method: max
  reset: month
  locator: pdf:p19
  quote: 'Demand charge: A monthly charge calculated as $/kVA/month, based on the maximum kVA demand measured as a single
    peak over a 30-minute period during the peak demand charging window/timeframe.'
  note: 'The Excess Demand Charge (the off-peak maximum minus the peak-window maximum, floored at zero) has its own
