# Energex curated facts. Eligibility quotes workbook cells (tariff-class headings, legends and labels) of the Energex
# Network Price Lists 2023-24..2026-27 (Sch 8 Wayback copies), the AER-hosted price lists 2023-24 and 2024-25, the AER
# 2024-25 Energex stakeholder report and the Energex sections of the AER consolidated 2025-26 (v1, v5) and 2026-27
# reports; none of those states TOU clock times, seasons or how a demand is measured. TOU windows, rate periods and
# demand measurement rules quote the Energex Network Tariff Guide of each year (2023-24..2026-27) and, for the
# sub-threshold trial tariffs, Energex's tariff trial notifications 2024-25, 2025-26 and 2026-27 (AER-hosted). The
# consolidated 2025-26 v5 rows labelled '(withdrawn from 1 Jul 25)*' carry the code HSAC (Historic SAC), not the
# withdrawn tariff's own code, so no 'withdrawn' availability criterion is recorded for them.
