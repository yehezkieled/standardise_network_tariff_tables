- codes: [EBPMPT1]
  doc: sources/dnsp/ergon/Ergon_Network_Tariff_Guide_2025-26_wayback.pdf
  fin_year: 2025-26
  charge_type: capacity
  measure: kW
  method: agreed
  reset: month
  minimum_value: 7.5
  locator: pdf:p29
  quote: 'Demand charge: A monthly charge calculated as $/kW/month. Application of charges: Minimum demand charge: Charge
    for pump size up to 7.5kW Remaining demand charge: Charge for pump size > 7.5kW This monthly $ per kW charge is applied
    to the larger of the customer’s pump size capacity, or 7.5kW.'
  note: 'Measured as the customer''s pump size (a stated capacity, not metered demand), at least 7.5 kW: the ''Minimum Capacity
    Charge'' (capacity_minimum) prices the first 7.5 kW and the ''Remaining Capacity Charge'' (capacity_remaining) the pump
    size above 7.5 kW. Appendix C works the charge per day of the billing period (''pump size less minimum demand value of
    7.5kW, multiplied by 12 months'', divided by 365.25 days).'
