# Ergon Energy curated facts (every fact quotes a workbook cell; tariff-class headings, legends and labels).
# Sources checked, every sheet incl. notes and Tariff Trials / CAC Trial sheets: Ergon Energy Network Price Lists
# 2023-24..2026-27 (Sch 8 Wayback copies), AER-hosted price lists 2023-24 and 2024-25, the AER 2024-25 Ergon stakeholder
# report and the Ergon sections of the AER consolidated 2025-26 (v1, v5) and 2026-27 reports. None states TOU clock
# times, demand measurement rules (interval/aggregation/window) or the months of 'Summer'/'Non Summer' (SAC Large
# 2023-24/2024-25 columns), so tou_schedules and demand_rules are empty; relations are empty because no document states
# a rename/replacement between parsed codes. The only stated quantity threshold is the 'Volume Peak Charge (over 10,000)'
# column (steps). regional_variant flags quote the 'Pricing Zone' cell (East/West/Mt Isa) of the tariff's row block.
