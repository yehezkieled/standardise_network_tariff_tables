# Ergon Energy curated facts. Eligibility and steps quote workbook cells (tariff-class headings, legends and labels) of
# the Ergon Energy Network Price Lists 2023-24..2026-27 (Sch 8 Wayback copies), the AER-hosted price lists 2023-24 and
# 2024-25, the AER 2024-25 Ergon stakeholder report and the Ergon sections of the AER consolidated 2025-26 (v1, v5) and
# 2026-27 reports; none of those states TOU clock times, the months of 'Summer'/'Non Summer' or how a demand or
# capacity quantity is measured. TOU windows, rate periods and demand/capacity measurement rules quote Ergon's Network
# Tariff Guide of each year (2023-24..2026-27; the guides apply the TSS 2020-25 and 2025-30 structures) and, for the
# sub-threshold trial tariffs (LFLEX/CFLEX/CPRCE 2024-25, SPRCE/CPRCE 2025-26, SLVDB/CHVDB 2026-27), Ergon's tariff trial
# notifications (AER-hosted). The only stated quantity threshold in the price lists is the 'Volume Peak Charge (over
# 10,000)' column (steps).
distributor: ergon
tou_schedules:
- id: ergon-2627-residential-tou
  doc: sources/dnsp/ergon/Ergon_Network_Tariff_Guide_2026-27.pdf
  fin_year: 2026-27
  name: Residential Time of Use volume windows (RTOUE, RTDEM)
  time_basis: not_stated
  public_holidays: unchanged
  covers_full_day: true
  locator: pdf:p21
  quote: 'The following time periods apply to volume charges:'
  note: 'RTOUE (p21) and RTDEM (p25, ''Shoulder window: 9pm-11am on weekdays and weekends'') state the same three windows,
    as does Table 6. ''Weekdays and weekends'' = every day. ''Weekdays'' and ''Weekends'' include public holidays and bank
    holidays for state, regional and local (definitions under Table 6, p20), so public holidays keep their day of the week.
    Times as printed (Queensland; the guide names no clock basis).'
  windows:
  - period: shoulder
    label: Shoulder window
    days: all_days
    start: 00:00
    end: '11:00'
    quote: 'Shoulder window: 9pm to 11am on weekdays and weekends'
  - period: off_peak
    label: Off Peak window
    days: all_days
    start: '11:00'
    end: '16:00'
    quote: 'Off Peak window: 11am to 4pm on weekdays and weekends'
  - period: peak
    label: Peak window
    days: all_days
    start: '16:00'
    end: '21:00'
    quote: 'Peak window: 4pm to 9pm on weekdays and weekends'
  - period: shoulder
    label: Shoulder window
    days: all_days
    start: '21:00'
    end: '24:00'
    quote: 'Shoulder window: 9pm to 11am on weekdays and weekends'
  tariffs:
  - codes: [ERTOUET1, MRTOUET4, WRTOUET1]
    applies_to: usage
    locator: pdf:p21
