- codes: [ELTOUDT1, ELTOUDT2, ELTOUDT3, MLTOUDT4, WLTOUDT1, WLTOUDT2, WLTOUDT3]
  doc: sources/dnsp/ergon/Ergon_Network_Tariff_Guide_2024-25_wayback.pdf
  fin_year: 2024-25
  component: Excess Demand Charge
  tou_period: off_peak
  locator: pdf:p27
  quote: 'Excess demand charge: A monthly charge calculated as $/kVA/month. It is measured as the single maximum demand outside
    the peak demand window minus the maximum demand during the peak demand window.'
  note: The excess demand charge applies outside the peak demand window, which Table 6 names the off-peak demand window; it
    is measured (off-peak maximum less peak maximum, floored at zero) by its excess_over_window_max charge rule.
- codes: [EDMTT1, EDMTT2, EDMTT3, MDMTT4, WDMTT1, WDMTT2, WDMTT3]
  doc: sources/dnsp/ergon/Ergon_Network_Tariff_Guide_2024-25_wayback.pdf
  fin_year: 2024-25
  component: Demand Charge kW
  tou_period: anytime
  locator: pdf:p28
  quote: 'Demand charge: A monthly charge calculated as $/kVA/month (or kW)), applied to the kVA amount by which a customer’s
    actual monthly maximum demand measured as a single peak over a 30-minute period during the month is greater than the demand
    threshold applicable to the customer’s network tariff. Where the monthly metered maximum demand is less than the demand
    threshold, the chargeable demand for that month is set to zero and no demand charge is payable for that month. The threshold
    demands applicable to the SAC Large demand tariffs are: Demand Medium: 120 kW or 135 kVA'
  note: The tariff is an anytime demand tariff (no peak charging window for demand). The price list prints a kVA and a kW
    demand charge; the kW one (for metering without kVA data) is given the period anytime so that its own kW rule and threshold
    measure it, apart from the kVA rule.
