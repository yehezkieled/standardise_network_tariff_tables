- codes: [ELTOUDT1, ELTOUDT2, ELTOUDT3, MLTOUDT4, WLTOUDT1, WLTOUDT2, WLTOUDT3]
  doc: sources/dnsp/ergon/Ergon_Network_Tariff_Guide_2024-25_wayback.pdf
  fin_year: 2024-25
  charge_type: demand
  tou_period: off_peak
  measure: kVA
  interval_min: 30
  method: excess_over_window_max
  reset: month
  locator: pdf:p27
  quote: "Excess demand charge: A monthly charge calculated as $/kVA/month. It is measured as the single maximum demand
    outside the peak demand window minus the maximum demand during the peak demand window. Where the maximum monthly
    demand outside the peak demand window is less than the highest monthly maximum demand inside the peak window, the
    excess demand charge for that billing period is set to zero."
  note: "The Excess Demand Charge of LTOUD, priced off_peak (rate_periods: outside the peak demand window, 4pm to 9pm
    weekdays): the highest kVA outside the peak demand window less the highest inside it in the month, zero when
    negative. The interval is the tariff description's on the same page: 'the demand charges are applied to the maximum
    half hourly kVA'."
