- codes: [EDSTT1, MDSTT4, WDSTT1]
  doc: sources/dnsp/ergon/Ergon_Network_Tariff_Guide_2026-27.pdf
  fin_year: 2026-27
  charge_type: demand
  measure: kVA
  interval_min: 30
  method: max
  reset: month
  threshold_value: 35
  locator: pdf:p26
  quote: 'Demand charge: A monthly charge calculated as $/kVA/month applied to the kVA amount by which a customer’s actual
    monthly maximum demand measured as a single peak over a 30-minute period during the month is greater than the demand threshold
    applicable to the customer’s network tariff. Where the monthly metered maximum demand is less than the demand threshold,
    the chargeable demand for that month is set to zero and no demand charge is payable for that month. The demand threshold
    applicable to Demand Small tariff is 35 kVA.'
