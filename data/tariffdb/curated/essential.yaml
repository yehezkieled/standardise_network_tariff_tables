    when the load occurs. This means that Peak and Shoulder Demand will be divided by the number of weekdays[,] Off Peak Demand
    by the total number of days. 3. The average ToU Demand calculated above will be multiplied by the ToU Demand rates.''
    The shoulder demand is divided by the number of weekdays. The metering interval is not stated for this tariff: the glossary''s
    ''30 minute clocked'' (THREE RATE DEMAND) names the average daily demand tariffs as exceptions.'
