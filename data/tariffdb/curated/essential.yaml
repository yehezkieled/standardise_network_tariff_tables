  note: 'Definitions, read by column: ''THREE RATE DEMAND the Demand charge ($/kVA/month) is applied to the calendar monthly
    kVA demand measured by the meter for the peak, shoulder and off-peak periods. The monthly kVA demand is the maximum half
    hour demand for the month occurring within the peak, shoulder and off-peak periods and is calculated using the kWh and
    kVArh energy components recorded by the NER compliant meter. The method of demand measurement is 30 minute clocked. LV
    ToU Average Daily Demand and HV ToU Average Daily Demand tariffs are exceptions to this description. Demand charges for
    these tariffs are'' These tariffs price peak, shoulder and off-peak demand in $/kVA/M.'
- codes: [BLND1CO, BLND1NO, BHND1CO, BLND1SR, BLND1SU, BHND1SO, BHTD1SO]
  doc: sources/archive/essential/2021-22/NetworkPriceListandExplanatoryNotes202122.pdf
  fin_year: 2021-22
  charge_type: demand
  measure: kVA
  interval_min: 30
  method: max
  reset: month
  locator: pdf:p9
  quote: SINGLE RATE DEMAND is the Demand Charge is
  note: 'Definitions, read by column: ''SINGLE RATE DEMAND is the Demand Charge is based on the highest measured half-hour
    kVA demand during the month. A separate demand will apply at each'' These obsolete ''1 Rate'' demand tariffs price one
    demand charge ($/kVA/M) for any time of the month.'
- codes: [BLND1SR, BLND1SU, BHND1SO, BHTD1SO]
  doc: sources/archive/essential/2021-22/NetworkPriceListandExplanatoryNotes202122.pdf
  fin_year: 2021-22
  charge_type: capacity
  measure: kVA
  interval_min: 30
  method: max
  reset: rolling_months
  lookback_months: 12
  locator: pdf:p8
  quote: CAPACITY CHARGES are monthly charges based on
  note: 'Definitions, read by column: ''CAPACITY CHARGES are monthly charges based on the required capacity of the connection
    (measured in $/KVA) whereby the charges are applied to the maximum half hourly KVA power reading that occurred at a customer’s
    connection point over the 12 months prior to a bill being calculated. Demand is rounded up to 20, 40, 60, 80, 100, 150,
    200, 300, 400, 500kVA and so on in 100kVA increments. These charges only exist for Obsolete tariffs.'' [UNSURE] The rounding
    up of the demand to 20, 40, 60 ... kVA steps is not stored (no charge_rule field holds it).'
- codes: [BLND3TO]
  doc: sources/archive/essential/2021-22/NetworkPriceListandExplanatoryNotes202122.pdf
  fin_year: 2021-22
