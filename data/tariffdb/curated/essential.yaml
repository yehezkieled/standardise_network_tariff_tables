- codes: [BLNS1AO, BHNS1AO]
  doc: sources/archive/essential/2021-22/NetworkPriceListandExplanatoryNotes202122.pdf
  fin_year: 2021-22
  charge_type: demand
  tou_period: peak
  measure: kVA
  method: avg_daily_max
  reset: month
  locator: pdf:p4
  quote: 1. The daily kVA maximum demand in each of the Peak, Shoulder and Off Peak periods will be metered for each day of
    the month. 2. The metered kVA Demand for each day of the Peak, Shoulder and Off-Peak periods will be summed for the month
    and divided by the number of days in the month when the load occurs. This means that Peak and Shoulder Demand will be
    divided by the number of week days, and Off Peak Demand by the total number of days.
  note: 'Tariff explanations of BLNS1AO and BHNS1AO: ''1. The daily kVA maximum demand in each of the Peak, Shoulder and Off
    Peak periods will be metered for each day of the month. 2. The metered kVA Demand for each day of the Peak, Shoulder and
    Off-Peak periods will be summed for the month and divided by the number of days in the month when the load occurs. This
    means that Peak and Shoulder Demand will be divided by the number of week days, and Off Peak Demand by the total number
    of days. 3. The average TOU Demand calculated above will be multiplied by the TOU Demand rates.'' The peak demand is divided
    by the number of weekdays. The metering interval is not stated for these tariffs: the THREE RATE DEMAND definition''s
    ''30 minute clocked'' names them as exceptions.'
