  quote: The Demand Charge for BLND3TO is based on the
  note: 'Read by column: ''The Demand Charge for BLND3TO is based on the highest measured half-hour kVA demand registered
    in either the peak or shoulder periods during the month.'' Each window below prices the demand rate the price list prints
    (stored as the peak demand rate), measured over the peak and the shoulder periods of the time periods (weekday peak 7am-9am
    and 5pm-8pm, shoulder 9am-5pm and 8pm-10pm). Time Periods (explanatory notes, read by column): ''TIME PERIODS All times
    are Eastern Standard Time (which includes Daylight Saving Time or Summer Time as defined in these Explanatory Notes).
    These times are unchanged when a public holiday falls on a week day.'' ''DAYLIGHT SAVINGS TIME will be applied to all
    customers with interval read meters and unmetered supplies in determining Network charges. Other customers will have Summer
    Time applied, see definition below. SUMMER TIME is the period from the last Sunday in October at 2am to the last Sunday
    in March at 3am of the following year. Summer time adjustments will be'' Unmetered and interval-read sites use the clock
    in force (local time).'
