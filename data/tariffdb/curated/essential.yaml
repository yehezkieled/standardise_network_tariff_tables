- codes:
  - BLNS1AO
  doc: sources/dnsp/essential/Essential_Price_List_and_Explanatory_Notes_2026-27.pdf
  fin_year: 2026-27
  charge_type: demand
  tou_period: peak
  measure: kVA
  method: avg_daily_max
  reset: month
  locator: pdf:p5
  quote: 1. The daily kVA maximum demand in each of the Peak, Shoulder and Off Peak periods will be metered for each day of
    the month. 2. The metered kVA Demand for each day of the Peak, Shoulder and Off-Peak periods will be summed for the month
    and divided by the number of days in the month when the load occurs. This means that Peak and Shoulder Demand will be
    divided by the number of weekdays
  note: 'BLNS1AO ''LV ToU Avg daily Demand'' tariff explanation (heading on p5): ''1. The daily kVA maximum demand in each
    of the Peak, Shoulder and Off Peak periods will be metered for each day of the month. 2. The metered kVA Demand for each
    day of the Peak, Shoulder and Off-Peak periods will be summed for the month and divided by the number of days in the month
    when the load occurs. This means that Peak and Shoulder Demand will be divided by the number of weekdays[,] Off Peak Demand
    by the total number of days. 3. The average ToU Demand calculated above will be multiplied by the ToU Demand rates.''
    The peak demand is divided by the number of weekdays. The metering interval is not stated for this tariff: the glossary''s
    ''30 minute clocked'' (THREE RATE DEMAND) names the average daily demand tariffs as exceptions.'
