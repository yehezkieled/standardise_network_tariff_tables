  measure: kVA
  interval_min: 30
  method: max
  reset: month
  locator: pdf:p10
  quote: maximum half hour demand for the month occurring
  note: 'Definitions, ''THREE RATE DEMAND'' (p10, a three-column page whose lines interleave): ''THREE RATE DEMAND are the
    Demand charges ($/kVA/month) applied to the calendar monthly kVA demand measured by the meter for the peak, shoulder and
    off-peak periods. The monthly kVA demand is the maximum half hour demand for the month occurring within the peak, shoulder
    and off-peak periods ... The method of demand measurement is 30 minute clocked. LV ToU Average Daily Demand and HV ToU
    Average Daily Demand tariffs are exceptions''. These tariffs price Peak, Shoulder and Off Peak demand in $/kVA/M (p1).'
