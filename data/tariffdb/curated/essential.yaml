    charges. Other customers will have Summer Time applied, see definition below. SUMMER TIME is the period from the last
    Sunday in October at 2am to the last Sunday in March at 3am of the following year. Summer time adjustments will be'' Unmetered
    and interval-read sites use the clock in force (local time). [UNSURE] Basic and accumulation meters ''will have Summer
    Time applied'' (last Sunday in October to last Sunday in March), which differs by up to a few weeks from NSW daylight
    saving; the windows are stored as local clock time.'
