  doc: sources/archive/evoenergy/2019-20/evoenergy-statement-of-tariff-classes-and-tariffs-2019-20.pdf
  fin_year: 2019-20
  charge_type: demand
  measure: kW
  interval_min: 30
  method: max
  reset: billing_period
  locator: pdf:p8
  quote: Maximum demand charges—these are a charge per unit of maximum demand (in c/kVA/day or c/kW/day10). The maximum demand
    is the highest demand calculated coincident over a 30-minute clocked interval, starting on the full or half hour, during
    the specified peak time within a billing period (generally per calendar month).
  note: Section 2 definition of the maximum demand charging parameter, for every tariff's maximum demand charge; '10' is a
    footnote marker. The tariff tables restate it per tariff ('within the billing period (generally a calendar month)'). This
    rule covers the demand rates priced per kW (c/kW/day).
