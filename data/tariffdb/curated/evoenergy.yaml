- id: evo-2023-24-027-export-window
  doc: sources/dnsp/evoenergy/Evoenergy_Statement_of_Tariff_Classes_and_Tariffs_2023-24.pdf
  fin_year: 2023-24
  name: Residential battery network seasonal export charge window (trial)
  time_basis: standard_time
  public_holidays: not_stated
  covers_full_day: false
  locator: pdf:p10
  quote: 3.75 kWh during any one-hour period between 11am – 3pm
  note: Table text is interleaved with the neighbouring column in the PDF text layer; the explanation reads 'The seasonal
    export charge is levied on exports in excess of 3.75 kWh during any one-hour period between 11am – 3pm (AEST) every day.
    The export charge varies according to seasons.' Season months are not defined in this statement. Table 2.6 (p23) prices
    027 and 028 with an 'Export Threshold Charge' row for the high season and one for the low season, so the window is
    stated once per season, each quoting its row's season as printed there; the hours are this schedule's quote (p10).
  windows:
  - period: solar_soak
    label: 'Export Threshold Charge : high season'
    days: all_days
    start: '11:00'
    end: '15:00'
    months: not_stated
    season_label: high season
    season: high
    locator: pdf:p23
    quote: 'Charge : high season'
  - period: solar_soak
    label: 'Export Threshold Charge : low season'
    days: all_days
    start: '11:00'
    end: '15:00'
    months: not_stated
    season_label: low season
    season: low
    locator: pdf:p23
    quote: 'Charge : low season'
  tariffs:
  - codes:
    - '027'
    applies_to: export
    locator: pdf:p10
    quote: (027)  Energy at max times
    note: Table 2.1 row label 'Residential battery (027)'; the same row's explanation (p10) states the seasonal export charge
      window.
  - codes:
    - 028
    applies_to: export
    locator: pdf:p23
    quote: 028 Residential Battery Network XMC*
    note: 'Table 2.6 (p23) prices ''028 Residential Battery Network XMC*'' with ''Export Threshold Charge : high season'' and
      ''... low season'', as for 027.'
