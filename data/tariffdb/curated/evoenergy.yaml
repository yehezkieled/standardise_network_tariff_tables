charge_rules:
- codes: all
  doc: sources/dnsp/evoenergy/Evoenergy_Statement_of_Tariff_Classes_and_Tariffs_2023-24.pdf
  fin_year: 2023-24
  charge_type: demand
  measure: kW
  interval_min: 30
  method: max
  reset: billing_period
  locator: pdf:p6
  quote: Maximum demand charges—these are a charge per unit of maximum demand (in c/kVA/day or c/kW/day11). The maximum demand
    is the highest demand calculated coincident over a 30-minute clocked interval, starting on the full or half hour, during
    the specified peak time within a billing period (generally per calendar month).
  note: 'Section 2 definition of the maximum demand charging parameter, for every tariff''s maximum demand charge; this rule
    covers the demand rates priced per kW (c/kW/day). ''11'' is a footnote marker. The tariff tables restate it per tariff
    (e.g. p9 for 025: ''within the billing period (a calendar month)''). The capacity charge (''the previous 13 months inclusive
    of the current billing month'', same page) has its own rule.'
