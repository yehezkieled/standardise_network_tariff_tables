  fin_year: 2019-20
  component: Capacity
  tou_period: anytime
  locator: pdf:p8
  quote: Capacity charges—these are a charge per unit of maximum demand (in c/kVA/day). The maximum demand is the highest
    demand recorded over a 30-minute clocked interval during the previous 13 months inclusive of the current billing month.
  note: The capacity charge is measured over all 30-minute intervals of the previous 13 months, with no time-of-day restriction
    (unlike the maximum demand charge, 'during the specified peak time'), so it is not measured in the business-time demand
    window.
