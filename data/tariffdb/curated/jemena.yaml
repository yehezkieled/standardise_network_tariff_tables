- id: jemena-2017-dnsp-res-demand-window
  doc: sources/archive/jemena/2017/2017-Tariff-Schedule.aspx.pdf
  fin_year: "2017"
  name: General Purpose - Demand charging window
  time_basis: not_stated
  public_holidays: as_non_business_day
  covers_full_day: false
  locator: "pdf:p1"
  quote: "Demand charging window 3pm - 9pm work days; reset monthly"
  note: "'work days' recorded as business_day. The schedule states no clock for the window. Public holidays: the 2016-20 tariff structure statement (amended September 2017), pdf:p55, records the preference 'for the residential demand charging window to exclude weekends and public holidays (i.e. work days only)', and its glossary (pdf:p115) defines business day as excluding 'gazetted public holidays in Melbourne'."
  windows:
  - period: peak
    label: "Demand charging window"
    days: business_day
    start: "15:00"
    end: "21:00"
  tariffs:
  - codes: [A10D, F10D, T10D]
    applies_to: demand
    locator: "pdf:p1"
    quote: "A10D / F10D / T10D General Purpose - Demand Energy consumption - single rate all times Demand charging window 3pm - 9pm work days; reset monthly"
- id: jemena-2017-dnsp-sb-demand-window
  doc: sources/archive/jemena/2017/2017-Tariff-Schedule.aspx.pdf
  fin_year: "2017"
  name: Small business General Purpose - Demand charging window
  time_basis: not_stated
  public_holidays: as_non_business_day
  covers_full_day: false
  locator: "pdf:p2"
  quote: "Demand charging window 10am - 8pm work days"
  note: "'work days' recorded as business_day. The schedule states no clock for the window. Public holidays: the 2016-20 tariff structure statement (amended September 2017) glossary (pdf:p115) defines business day as excluding 'gazetted public holidays in Melbourne'; its pdf:p77 states the aligned position is 'to exclude weekends and public holidays from a demand charge'."
  windows:
  - period: peak
    label: "Demand charging window"
    days: business_day
    start: "10:00"
    end: "20:00"
  tariffs:
  - codes: [A20D, F20D, T20D]
    applies_to: demand
    locator: "pdf:p2"
    quote: "A20D / F20D / T20D General Purpose Only available to customers consuming < 160 MWh pa and having a maximum demand < 60 kW Single rate all times Demand charging window 10am - 8pm work days"
