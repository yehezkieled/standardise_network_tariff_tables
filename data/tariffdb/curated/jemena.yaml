  fin_year: "2017"
  name: Energy periods (7 AM to 11 PM AEST Mon - Fri)
  time_basis: standard_time
  public_holidays: not_stated
  covers_full_day: true
  locator: "pdf:p1"
  quote: "Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  note: "AEST stated; read as standard time all year."
  windows:
  - period: peak
    label: "Peak"
    days: weekday
    start: "07:00"
    end: "23:00"
  - period: off_peak
    label: "Off peak all other times"
    days: weekday
    start: "00:00"
    end: "07:00"
  - period: off_peak
    label: "Off peak all other times"
    days: weekday
    start: "23:00"
    end: "24:00"
  - period: off_peak
    label: "Off peak all other times"
    days: weekend
    start: "00:00"
    end: "24:00"
  tariffs:
  - codes: [A10I, F10I, T10I]
    applies_to: usage
    locator: "pdf:p1"
    quote: "A10I / F10Ia / T10Ib Time of Use Interval Meter (closed to new entrants)c Available to customers with an interval meter Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A140]
    applies_to: usage
    locator: "pdf:p1"
    quote: "A140 Time of Use (closed to new entrants) This tariff is not available to existing customers that install an interval meter Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A210, F210, T210]
    applies_to: usage
    locator: "pdf:p2"
    quote: "A210 / F210a / T210b Time of Use Weekdays Only available to customers with a two rate accumulation meter or AMI meter AND consuming < 160 MWh pa and having a maximum demand < 60 kW Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A230, F230, T230]
    applies_to: usage
    locator: "pdf:p2"
    quote: "A230 / F230a / T230b Time of Use Weekdays - Demand Only available to customers with a meter capable of measuring demand and consuming > 40 MWh Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A290]
    applies_to: usage
    locator: "pdf:p3"
    quote: "A290 Unmetered Supply Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A300, F300, T300]
    applies_to: usage
    locator: "pdf:p3"
    quote: "A300 / F300a / T300b LV 0.4 - 0.8 GWh Only available to non-embedded network customers consuming ≤ 0.8 GWh pa Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A30E]
    applies_to: usage
    locator: "pdf:p3"
    quote: "A30E LV Annual Consumption ≤≤≤≤ 0.8 GWh EN Only available to embedded network customers consuming ≤ 0.8 GWh pa Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A320]
    applies_to: usage
    locator: "pdf:p3"
    quote: "A320 LV 0.8+ - 2.2 GWh Only available to non-embedded network customers consuming > 0.8 GWh pa BUT ≤ 2.2 GWh pa Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A32E]
    applies_to: usage
    locator: "pdf:p3"
    quote: "A32E LV 0.8+ - 2.2 GWh EN Only available to embedded network customers consuming > 0.8 GWh pa BUT ≤ 2.2 GWh pa Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A340]
    applies_to: usage
    locator: "pdf:p4"
    quote: "A340 LV 2.2+ - 6.0 GWh Only available to non-embedded network customers consuming > 2.2 GWh pa BUT ≤ 6.0 GWh pa Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A34E]
    applies_to: usage
    locator: "pdf:p4"
    quote: "A34E LV 2.2+ GWh EN Only available to embedded network customers consuming > 2.2 GWh pa Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A34M]
    applies_to: usage
    locator: "pdf:p4"
    quote: "A34M LV 2.2+ - 6.0 GWh (closed to new entrants)e MS Only available to non-embedded network customer taking supply from multiple NMIs on a single site AND the aggregated annual consumption from those NMIs is > 2.2 GWh pa BUT ≤ 6.0 GWh pa Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A370]
    applies_to: usage
    locator: "pdf:p4"
    quote: "A370 LV 6.0+ GWh Only available to non-embedded network customers consuming > 6.0 GWh pa Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A37M]
    applies_to: usage
    locator: "pdf:p4"
    quote: "A37M LV 6.0+ GWh (closed to new entrants)e MS Only available to non-embedded network customer taking supply from multiple NMIs on a single site AND the aggregated annual consumption from those NMIs is > 6.0 Gwh Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A400]
    applies_to: usage
    locator: "pdf:p5"
    quote: "A400 HV Only available to non-embedded network customers consuming < 55 GWh pa Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A40E]
    applies_to: usage
    locator: "pdf:p5"
    quote: "A40E HV EN Only available to embedded network customers Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A40R]
    applies_to: usage
    locator: "pdf:p5"
    quote: "A40R HV (closed to new entrants)e RF Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A480]
    applies_to: usage
    locator: "pdf:p5"
    quote: "A480 HV - Annual Consumption ≥≥≥≥ 55 GWh Only available to non-embedded customers consuming ≥ 55 GWh pa Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A500]
    applies_to: usage
    locator: "pdf:p5"
    quote: "A500 Subtransmission Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A50E]
    applies_to: usage
    locator: "pdf:p6"
    quote: "A50E SubtransmissionEG Available to Embedded Generators connected to TTS-SSS-ST-EPG-TTS Loop. Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times"
  - codes: [A50A]
    applies_to: usage
    locator: "pdf:p6"
    quote: "Peak: 7 AM to 11 PM AEST \"Mon - Fri\" ; Off peak all other times - Standing charge $/customer pa $53,501.837 - Peak Unit rate ¢/kWh 2.369 - Off Peak Unit rate ¢/kWh 0.725 - Demand rate $/kVA pa $24.479"
    note: "The A50A entry starts at the foot of pdf:p5 ('A50A SubtransmissionMA') and continues at the top of pdf:p6 with these hours and its prices."
