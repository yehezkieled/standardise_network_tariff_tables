# Hand-curated TOU windows and eligibility for powerwater.
# Every item cites a document locator and a verbatim quote; validate with scripts/tariffdb/curated.py.
# 2016-17..2018-19: Schedule A and B peak/off-peak periods quote footnote [2] of each year's Network Tariffs and Charges
# list; 2019-20..2022-23: Tariff 3/5/6/7 demand peak periods and demand rules quote each year's Network Pricing Proposal
# (sources/archive/powerwater/); none of them states a clock basis.
distributor: powerwater
tou_schedules:
- id: pwc-2324-sc-t3-demand
  doc: sources/dnsp/powerwater/PWC_SCS_Tariffs_2023-24_wayback.pdf
  fin_year: 2023-24
  name: Tariff 3 demand charge peak period (1 October – 31 March)
  time_basis: not_stated
  public_holidays: as_weekday
  covers_full_day: false
  locator: pdf:p1
  quote: The peak period rates apply to usage between 12pm and 9pm on any weekday, including public holidays.
  note: Weekday windows explicitly include public holidays ('on any weekday, including public holidays').
  windows:
  - period: peak
    label: Peak period
    days: weekday
    start: '12:00'
    end: '21:00'
    months: 10,11,12,1,2,3
    season_label: 1 October – 31 March
    locator: pdf:p1
    quote: For Tariff 3 LV Smart Meter customers peak charges apply from 1 October through 31 March.
  tariffs:
  - codes:
    - Tariff 3
    applies_to: demand
- id: pwc-2324-sc-annual-demand
  doc: sources/dnsp/powerwater/PWC_SCS_Tariffs_2023-24_wayback.pdf
  fin_year: 2023-24
  name: Tariffs 5, 6 and 7 demand charge peak period (all year)
  time_basis: not_stated
  public_holidays: as_weekday
  covers_full_day: false
  locator: pdf:p1
  quote: The peak period rates apply to usage between 12pm and 9pm on any weekday, including public holidays.
  note: '''For all other customers annual peak charges apply''; Tariffs 5, 6 and 7 are the other tariffs with a Demand Charge*
    price. Weekdays include public holidays.'
  windows:
  - period: peak
    label: Peak period
    days: weekday
    start: '12:00'
    end: '21:00'
    months: all
    season_label: annual
    locator: pdf:p1
    quote: For all other customers annual peak charges apply.
  tariffs:
  - codes:
    - Tariff 5
    - Tariff 6
    - Tariff 7
    applies_to: demand
    locator: pdf:p1
    quote: 'Tariff 5: LV Majors Tariff 80.000000 0.011458 14.000000 Tariff 6: HV Minors Tariff 100.000000 0.013000 11.000000
      Tariff 7: HV Majors Tariff 100.000000 0.013000 11.000000'
    note: Price-table rows with a price in the 'Demand Charge*' ($/kVA) column; the '*' footnote gives the 12pm-9pm weekday
      peak period and 'For all other customers annual peak charges apply', i.e. other than Tariff 3; Tariffs 3, 5, 6 and 7 are
      the only rows with a Demand Charge* price.
