- id: sapn-2223-cbd-peak-demand
  doc: sources/archive/sapn/2022-23/SA_Power_Networks_-_Annual_Pricing_Proposal_-_updated_12_April_2022.pdf
  fin_year: 2022-23
  name: Large Business peak demand window – CBD
  time_basis: local_time
  public_holidays: as_non_business_day
  covers_full_day: false
  locator: pdf:p28
  quote: • CBD 11:00am – 5:00pm CDST WD
  note: 'CBD-only codes take the CBD window and SA codes the non-CBD window, as the code columns of the tariff schedules are
    headed ''SA'' and ''CBD only''. ''WD'' is defined in the document''s glossary (pdf:p101): ''WD Monday Tuesday Wednesday
    Thursday Friday excluding Public Holidays'' and ''NWD Saturday, Sunday and Public Holidays'', so WD windows are business
    days and public holidays take the non-business-day treatment.'
  windows:
  - period: peak
    label: Demand – Peak (CBD)
    days: business_day
    start: '11:00'
    end: '17:00'
    months: 11,12,1,2,3
    season_label: November – March
    locator: pdf:p28
    quote: • CBD 11:00am – 5:00pm CDST WD
  tariffs:
  - codes:
    - LBADCBD
    applies_to: demand
    locator: pdf:p61
    quote: LBAD LBADCBD Large LV Business Annual Demand
    note: Row of the DUoS tariff schedule (Table 32, p61), whose two code columns are headed 'SA' and 'CBD only' (the NUoS
      schedule, Table 31, p59, lists the same rows).
