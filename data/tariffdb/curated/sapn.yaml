- id: sapn-1617-mrd-demand
  doc: sources/archive/sapn/2016-17/SAPN_Tariffs_1_July_2016_id55342_20170224.pdf
  fin_year: 2016-17
  name: Residential monthly actual kW demand windows (MRD)
  time_basis: local_time
  public_holidays: not_stated
  covers_full_day: false
  locator: pdf:p10
  quote: Actual Demand charges for residential customers are determined on the basis of the maximum half-hour trading interval
    since the last meter read
  note: 'Note 6 of ''Notes accompanying 2016/17 Tariffs'' (p10); note 2 j. (p8-9) gives the seasons: ''different prices applying
    in the peak summer months (November to March) and the shoulder winter months (April to October)''. The summer window is
    stated in CDST and falls wholly in South Australia''s daylight saving months; the winter one in ''CST or (when operating)
    CDST'', so both read as local time.'
  windows:
  - period: peak
    label: Summer Peak Demand
    days: all_days
    start: '16:00'
    end: '21:00'
    months: 11,12,1,2,3
    season_label: November to March
    season: summer
    locator: pdf:p10
    quote: a. Summer Peak Demand on all days between 1600 and 2100 CDST during November to March only;
  - period: shoulder
    label: Winter Shoulder Demand
    days: all_days
    start: '16:00'
    end: '21:00'
    months: 4,5,6,7,8,9,10
    season_label: April to October
    season: winter
    locator: pdf:p9
    quote: months (April to October), as detailed in the Tariff Schedule. The time period when the monthly peak demand is
      measured is between 1600 and 2100 local SA time.
  tariffs:
  - codes:
    - MRD
    applies_to: demand
    locator: pdf-ocr:p1
    quote: MRD Residential Monthly Actual kW Demand (min demand 1.0 kW)
    note: Row of the 2016/17 Final Network Prices schedule (p1, an image read by OCR), the page the rates come from.
- id: sapn-1617-two-rate-energy
  doc: sources/archive/sapn/2016-17/SAPN_Tariffs_1_July_2016_id55342_20170224.pdf
  fin_year: 2016-17
  name: Business two-rate peak and off-peak energy windows
  time_basis: standard_time
  public_holidays: not_stated
  covers_full_day: true
  locator: pdf:p10
  quote: Peak energy is energy consumed on business days between the hours of 0700 and 2100 Central Standard Time.
  note: 'Note 6 (p10): ''Type 6 meters typically measure this for week days whereas Type 1-5 meters will measure this in on
    work days. For Distribution Network Users with Type 6 metering that does not recognize specific days, peak energy is energy
    consumed on each day between the hours of 0700 and 2100 (Central Standard Time).'' The windows are those of business days;
    a Type 6 meter that does not recognise days records peak on every day. BDT and SBDT are the two-rate parts of the demand
    transition tariffs (their usage columns are Peak and Off-Peak).'
  windows:
  - period: off_peak
    label: Off-peak
    days: business_day
    start: 00:00
    end: 07:00
    locator: pdf:p10
    quote: 7. Off-peak energy is energy consumed other than peak energy.
  - period: peak
    label: Peak
    days: business_day
    start: 07:00
    end: '21:00'
    locator: pdf:p10
    quote: Peak energy is energy consumed on business days between the hours of 0700 and 2100 Central Standard Time.
  - period: off_peak
    label: Off-peak
    days: business_day
    start: '21:00'
    end: '24:00'
    locator: pdf:p10
    quote: 7. Off-peak energy is energy consumed other than peak energy.
  - period: off_peak
    label: Off-peak
    days: non_business_day
    start: 00:00
    end: '24:00'
    locator: pdf:p10
    quote: 7. Off-peak energy is energy consumed other than peak energy.
