- id: sapn-1617-actual-demand
  doc: sources/archive/sapn/2016-17/SAPN_Tariffs_1_July_2016_id55342_20170224.pdf
  fin_year: 2016-17
  name: Business monthly actual kVA demand windows (BD, SBD, HBD, BDT, SBDT)
  time_basis: local_time
  public_holidays: not_stated
  covers_full_day: false
  locator: pdf:p10
  quote: 'Actual Demand charges for business customers are determined on the basis of the maximum half-hour trading interval
    since the last meter read (Type 1-4 meters are assumed to be read each calendar month) for:'
  note: Note 5 of 'Notes accompanying 2016/17 Tariffs' (p10). 'c. Off-peak Demand at all other times (the price is zero for
    actual off-peak demand).' Shoulder is stated as 'CST or (when operating) CDST', i.e. local clock time; the peak window
    is stated in CDST and falls wholly in November to March, all of which South Australia spends on daylight saving time,
    so both read as local time. 'Work days' is not defined in the document.
  windows:
  - period: peak
    label: Summer Peak Demand
    days: business_day
    start: '16:00'
    end: '21:00'
    months: 11,12,1,2,3
    season_label: November to March
    season: summer
    locator: pdf:p10
    quote: a. Summer Peak Demand on work days between 1600 and 2100 CDST during November to March only;
  - period: shoulder
    label: Year-round Shoulder Demand
    days: business_day
    start: '12:00'
    end: '16:00'
    months: all
    season_label: Year-round
    locator: pdf:p10
    quote: b. Year-round Shoulder Demand on work days between 1200 and 1600 CST or (when operating) CDST);
  tariffs:
  - codes:
    - BD
    applies_to: demand
    locator: pdf-ocr:p1
    quote: BD Business Monthly Actual kVA Demand $ 0.0505
    note: Row of the 2016/17 Final Network Prices schedule (p1, an image read by OCR), the page the rates come from.
  - codes:
    - SBD
    applies_to: demand
    locator: pdf-ocr:p1
    quote: SBD Business Monthly Actual kVA Demand
    note: Row of the 2016/17 Final Network Prices schedule (p1, an image read by OCR), the page the rates come from.
  - codes:
    - HBD
    applies_to: demand
    locator: pdf-ocr:p1
    quote: HBD Business Monthly Actual kVA Demand
    note: Row of the 2016/17 Final Network Prices schedule (p1, an image read by OCR), the page the rates come from.
  - codes:
    - BDT
    applies_to: demand
    locator: pdf-ocr:p1
    quote: BDT Business Monthly Actual kVA Demand Trans. (obs. July 2016)
    note: Row of the 2016/17 Final Network Prices schedule (p1, an image read by OCR), the page the rates come from.
  - codes:
