  quote: Each of the four highest demand values used in each of the peak and off-peak calculations has to be from separate
    days during the bill period (i.e. only one highest 30 minute demand value for peak and off-peak can be used per day).
  note: 'Table 36 (pdf:p66) gives the measure and integration period per tariff; Table 37 the method and measurement period.
    TAS87, TAS88, TAS97 and TAS98: kW, 30 minutes, ''Time of use (average)'', ''Billing period''. If the billing period is
    under four days the average is over the days in it.'
