charge_rules:
- codes: [TAS87, TAS88, TAS97, TAS98]
  doc: sources/aer/2023-24_price_lists/TasNetworks_2023-24_Network_tariff_application_and_price_guide_4Apr2023.pdf
  fin_year: 2023-24
  charge_type: demand
  measure: kW
  interval_min: 30
  method: avg_top_n_days
  n: 4
  reset: billing_period
  locator: pdf:p67
  quote: "Each of the four highest demand values used in each of the peak and off-peak calculations has to be from
    separate days during the bill period (i.e. only one highest 30 minute demand value for peak and off-peak can be used
    per day)."
  note: "Section 20.2 (pdf:p66-67): TAS87, TAS88, TAS97 and TAS98 'are determined using the average of the largest four
    values of electrical demands during the entire billing period for each peak and off-peak period'; Table 36 (pdf:p66)
    gives kW and 30 minutes for each; Table 37 (pdf:p67) 'Time of use (average)', measurement period 'Billing period'. If
    the billing period is under four days the average is over the days in it."
- codes: [TAS89]
  doc: sources/aer/2023-24_price_lists/TasNetworks_2023-24_Network_tariff_application_and_price_guide_4Apr2023.pdf
  fin_year: 2023-24
  charge_type: demand
  measure: kVA
  interval_min: 30
  method: max
  reset: billing_period
  locator: pdf:p66
  quote: "Network tariff TAS89 is a maximum demand tariff based on time of day (peak and off-peak periods) with the
    maximum demand for this tariff is determined using the largest value of electrical demand during the entire billing
    period for each of the peak and off-peak periods."
  note: "Table 36 on the same page: 'Large business low voltage time of use demand TAS89 kVA 30'."
- codes: [TAS82]
  doc: sources/aer/2023-24_price_lists/TasNetworks_2023-24_Network_tariff_application_and_price_guide_4Apr2023.pdf
  fin_year: 2023-24
  charge_type: demand
  measure: kVA
  interval_min: 15
  method: max
  reset: billing_period
  locator: pdf:p39
  quote: "(b) multiplying the amount calculated in (a) by the anytime maximum demand recorded during the billing
    period."
  note: "Section 9.1.1 (TAS82). Table 36 (pdf:p66): 'Large business low voltage kVA demand TAS82 kVA 15'; Table 37
    (pdf:p67): 'ATMD', 'Billing period'."
- codes: [TAS87, TAS88, TAS98]
  doc: sources/dnsp/tasnetworks/TasNetworks_Network_Tariff_Application_Guide_2024-29_v2.1_16Jun2025.pdf
  fin_year: 2024-25
  charge_type: demand
  measure: kW
  interval_min: 30
  method: avg_top_n_days
  n: 4
  reset: billing_period
  locator: pdf:p74
  quote: "Each of the four demand values that form the peak and off-peak averages must be from different days within the
    billing period."
  note: "Appendix 1 section 1.2 (pdf:p74): 'The time of use demand charges for TAS87, TAS88 and TAS98 are based on the
    average of the four highest peak and off-peak demand readings during the entire billing period'; Table 6 (pdf:p73)
    gives KW, 30 minutes, 'Time of use', 'Billing period' for each. If the billing period is under four days the average
    is over the days in it."
- codes: [TAS89]
  doc: sources/dnsp/tasnetworks/TasNetworks_Network_Tariff_Application_Guide_2024-29_v2.1_16Jun2025.pdf
  fin_year: 2024-25
  charge_type: demand
  measure: kVA
  interval_min: 30
  method: max
  reset: billing_period
  locator: pdf:p74
  quote: "The time of use demand charges for low voltage large business time of use demand (TAS89) are based on the
    highest peak and off-peak demand readings during the entire billing period."
  note: "Table 6 (pdf:p73): TAS89 kVA, 30 minutes, 'Time of use', 'Billing period'."
- codes: [TAS82]
  doc: sources/dnsp/tasnetworks/TasNetworks_Network_Tariff_Application_Guide_2024-29_v2.1_16Jun2025.pdf
  fin_year: 2024-25
