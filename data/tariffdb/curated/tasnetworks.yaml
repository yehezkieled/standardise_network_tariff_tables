# TasNetworks curated tariff facts (TOU windows, demand rules, eligibility, relations, flags).
# Format and rules: scripts/tariffdb/curated.py. Every item quotes its source at the locator.
# TOU windows and demand rules are stated only in the 2023-24 Network tariff application and price guide. The other held
# TasNetworks documents (pricing schedules 2023-24 and 2024-25 PDF, 2025-26 and 2026-27 xlsx incl. their indicative
# 2026-27..2028-29 and Locational TUoS sheets, the AER 2024-25 stakeholder report and the TasNetworks sections of the AER
# consolidated 2025-26 v1/v5 and 2026-27 reports) carry no time windows, demand measurement rules or block thresholds,
# so 2024-25..2026-27 have no tou_schedules or demand_rules.
distributor: tasnetworks
