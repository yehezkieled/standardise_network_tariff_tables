  fin_year: 2023-24
  name: Controlled energy off-peak with afternoon boost (TAS61) supply envelopes
  time_basis: standard_time
  public_holidays: not_stated
  covers_full_day: false
  locator: pdf:p55
  quote: 'energy will be available daily for: • at least nine hours between 20:00 hours and 07:00 hours the following day;
    and • a further two hours between 13:00 hours and 16:30 hours.'
  note: 'Guide section 3.3 (pdf:p9): ''All times referred to in this Guide are in Australian Eastern Standard Time (AEST).''
    Public holidays are not mentioned anywhere in the guide. These are envelopes, not exact switching times: supply is at
    least 9 hours within 20:00-07:00 and a further 2 hours within 13:00-16:30, and pdf:p56 says ''TasNetworks will choose
    the actual times during the periods that the energy will be available.'''
