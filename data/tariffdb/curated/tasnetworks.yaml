# TasNetworks curated tariff facts (TOU windows, eligibility, demand measurement rules).
# Format and rules: scripts/tariffdb/curated.py. Every item quotes its source at the locator.
# TOU windows and demand rules: 2023-24 from the 2023-24 Network tariff application and price guide; 2024-25 to 2026-27
# from the 2024-2029 Network tariff application guide, one version per year (v2.1 from the 2024-25 pricing folder, v2.3
# from 2025-26, v2.4 from 2026-27; their time periods and Appendix 1 are identical). The pricing schedules (PDF/xlsx),
# the AER stakeholder reports and consolidated reports carry no time windows or block thresholds.
distributor: tasnetworks
tou_schedules:
