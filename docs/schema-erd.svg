<svg xmlns="http://www.w3.org/2000/svg" width="412" height="856" viewBox="0 0 412 856" role="img" aria-labelledby="erd-title"><title id="erd-title">Network tariff database: every table, its keys and the tables they reference</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}.box{fill:#ffffff;stroke:#94a3b8}.head{fill:#e2e8f0}.n{font-size:14px;font-weight:700}.r{font-size:11px;fill:#475569}.k{font-size:10px;font-weight:700;fill:#64748b}.c{font-size:11.5px}.t{fill:#64748b}.m{font-size:10.5px;fill:#94a3b8;font-style:italic}.bus{fill:none;stroke-width:1.8}.tick{fill:none;stroke-width:1.1;stroke-opacity:.75}</style><rect width="412" height="856" fill="#f8fafc"/><g><title>The electricity distribution network service providers whose tariffs are stored.</title><rect x="16" y="16" width="330" height="74" rx="7" class="box"/><path d="M16,44 V23 q0,-7 7,-7 H339 q7,0 7,7 V44 z" class="head"/><text x="26" y="35" class="n">distributor</text><text x="336" y="35" class="r" text-anchor="end">14 rows</text><text x="26" y="63" class="k">PK</text><text x="54" y="63" class="c">distributor_id</text><text x="54" y="81" class="m">+ 4 more columns</text></g><g><title>Every document version the rates, TOU windows and criteria are read from, with where it came from. A re-issued document is a new row; no version replaces another.</title><rect x="16" y="108" width="330" height="92" rx="7" class="box"/><path d="M16,136 V115 q0,-7 7,-7 H339 q7,0 7,7 V136 z" class="head"/><text x="26" y="127" class="n">source_document</text><text x="336" y="127" class="r" text-anchor="end">976 rows</text><text x="26" y="155" class="k">PK</text><text x="54" y="155" class="c">document_id</text><text x="26" y="173" class="k" style="fill:#2563eb">FK</text><text x="54" y="173" class="c">distributor_id <tspan class="t">→ distributor</tspan></text><text x="54" y="191" class="m">+ 11 more columns</text></g><g><title>A network tariff code in effect for a period, with its name and customer class as published and whether its rates are provisional (AER) or final (the distributor&#x27;s own list). A tariff with no rate rows is one its document lists with every price zero.</title><rect x="16" y="218" width="330" height="128" rx="7" class="box"/><path d="M16,246 V225 q0,-7 7,-7 H339 q7,0 7,7 V246 z" class="head"/><text x="26" y="237" class="n">tariff</text><text x="336" y="237" class="r" text-anchor="end">2,391 rows</text><text x="26" y="265" class="k">PK</text><text x="54" y="265" class="c">distributor_id, tariff_code,</text><text x="26" y="283" class="k"></text><text x="54" y="283" class="c">effective_from</text><text x="26" y="301" class="k" style="fill:#2563eb">FK</text><text x="54" y="301" class="c">distributor_id <tspan class="t">→ distributor</tspan></text><text x="26" y="319" class="k" style="fill:#d97706">FK</text><text x="54" y="319" class="c">document_id <tspan class="t">→ source_document</tspan></text><text x="54" y="337" class="m">+ 4 more columns</text></g><g><title>The network price charged for one component of a tariff: the total network price (no DUoS/TUoS/jurisdictional breakdown), GST exclusive, in standard units next to the value as published.</title><rect x="16" y="364" width="330" height="146" rx="7" class="box"/><path d="M16,392 V371 q0,-7 7,-7 H339 q7,0 7,7 V392 z" class="head"/><text x="26" y="383" class="n">rate</text><text x="336" y="383" class="r" text-anchor="end">8,823 rows</text><text x="26" y="411" class="k">PK</text><text x="54" y="411" class="c">rate_id</text><text x="26" y="429" class="k" style="fill:#2563eb">FK</text><text x="54" y="429" class="c">distributor_id <tspan class="t">→ distributor</tspan></text><text x="26" y="447" class="k" style="fill:#d97706">FK</text><text x="54" y="447" class="c">document_id <tspan class="t">→ source_document</tspan></text><text x="26" y="465" class="k" style="fill:#059669">FK</text><text x="54" y="465" class="c">distributor_id, tariff_code,</text><text x="26" y="483" class="k" style="fill:#059669"></text><text x="54" y="483" class="c">effective_from <tspan class="t">→ tariff</tspan></text><text x="54" y="501" class="m">+ 17 more columns</text></g><g><title>When each time-of-use period applies: day type, start and end time, months. Times are local clock times as the document states them.</title><rect x="16" y="528" width="330" height="146" rx="7" class="box"/><path d="M16,556 V535 q0,-7 7,-7 H339 q7,0 7,7 V556 z" class="head"/><text x="26" y="547" class="n">tou_window</text><text x="336" y="547" class="r" text-anchor="end">4,705 rows</text><text x="26" y="575" class="k">PK</text><text x="54" y="575" class="c">window_id</text><text x="26" y="593" class="k" style="fill:#2563eb">FK</text><text x="54" y="593" class="c">distributor_id <tspan class="t">→ distributor</tspan></text><text x="26" y="611" class="k" style="fill:#d97706">FK</text><text x="54" y="611" class="c">document_id <tspan class="t">→ source_document</tspan></text><text x="26" y="629" class="k" style="fill:#059669">FK</text><text x="54" y="629" class="c">distributor_id, tariff_code,</text><text x="26" y="647" class="k" style="fill:#059669"></text><text x="54" y="647" class="c">effective_from <tspan class="t">→ tariff</tspan></text><text x="54" y="665" class="m">+ 12 more columns</text></g><g><title>Who can or must be on the tariff: customer type, voltage, consumption or demand thresholds, meter type, assignment (default, opt-in, opt-out), availability, required technology.</title><rect x="16" y="692" width="330" height="146" rx="7" class="box"/><path d="M16,720 V699 q0,-7 7,-7 H339 q7,0 7,7 V720 z" class="head"/><text x="26" y="711" class="n">eligibility</text><text x="336" y="711" class="r" text-anchor="end">7,432 rows</text><text x="26" y="739" class="k">PK</text><text x="54" y="739" class="c">criterion_id</text><text x="26" y="757" class="k" style="fill:#2563eb">FK</text><text x="54" y="757" class="c">distributor_id <tspan class="t">→ distributor</tspan></text><text x="26" y="775" class="k" style="fill:#d97706">FK</text><text x="54" y="775" class="c">document_id <tspan class="t">→ source_document</tspan></text><text x="26" y="793" class="k" style="fill:#059669">FK</text><text x="54" y="793" class="c">distributor_id, tariff_code,</text><text x="26" y="811" class="k" style="fill:#059669"></text><text x="54" y="811" class="c">effective_from <tspan class="t">→ tariff</tspan></text><text x="54" y="829" class="m">+ 9 more columns</text></g><g stroke="#2563eb" fill="#2563eb"><title>references distributor</title><path d="M364,30.0 V753" class="bus"/><path d="M364,30.0 H354" class="bus"/><path d="M354,25.5 L347,30.0 L354,34.5 z" stroke="none"/><path d="M346,169 H364" class="tick"/><circle cx="364" cy="169" r="3" stroke="none"/><path d="M346,297 H364" class="tick"/><circle cx="364" cy="297" r="3" stroke="none"/><path d="M346,425 H364" class="tick"/><circle cx="364" cy="425" r="3" stroke="none"/><path d="M346,589 H364" class="tick"/><circle cx="364" cy="589" r="3" stroke="none"/><path d="M346,753 H364" class="tick"/><circle cx="364" cy="753" r="3" stroke="none"/></g><g stroke="#d97706" fill="#d97706"><title>references source_document</title><path d="M378,122.0 V771" class="bus"/><path d="M378,122.0 H354" class="bus"/><path d="M354,117.5 L347,122.0 L354,126.5 z" stroke="none"/><path d="M346,315 H378" class="tick"/><circle cx="378" cy="315" r="3" stroke="none"/><path d="M346,443 H378" class="tick"/><circle cx="378" cy="443" r="3" stroke="none"/><path d="M346,607 H378" class="tick"/><circle cx="378" cy="607" r="3" stroke="none"/><path d="M346,771 H378" class="tick"/><circle cx="378" cy="771" r="3" stroke="none"/></g><g stroke="#059669" fill="#059669"><title>references tariff</title><path d="M392,232.0 V807" class="bus"/><path d="M392,232.0 H354" class="bus"/><path d="M354,227.5 L347,232.0 L354,236.5 z" stroke="none"/><path d="M346,479 H392" class="tick"/><circle cx="392" cy="479" r="3" stroke="none"/><path d="M346,643 H392" class="tick"/><circle cx="392" cy="643" r="3" stroke="none"/><path d="M346,807 H392" class="tick"/><circle cx="392" cy="807" r="3" stroke="none"/></g></svg>
