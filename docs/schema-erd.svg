<svg xmlns="http://www.w3.org/2000/svg" width="426" height="1496" viewBox="0 0 426 1496" role="img" aria-labelledby="erd-title"><title id="erd-title">Network tariff database: every table, its keys and the tables they reference</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}.box{fill:#ffffff;stroke:#94a3b8}.head{fill:#e2e8f0}.n{font-size:14px;font-weight:700}.r{font-size:11px;fill:#475569}.k{font-size:10px;font-weight:700;fill:#64748b}.c{font-size:11.5px}.t{fill:#64748b}.m{font-size:10.5px;fill:#94a3b8;font-style:italic}.bus{fill:none;stroke-width:1.8}.tick{fill:none;stroke-width:1.1;stroke-opacity:.75}</style><rect width="426" height="1496" fill="#f8fafc"/><g><title>Every value a controlled column may hold, with its meaning. data_dictionary.value_list names the list a column takes its values from.</title><rect x="16" y="16" width="330" height="74" rx="7" class="box"/><path d="M16,44 V23 q0,-7 7,-7 H339 q7,0 7,7 V44 z" class="head"/><text x="26" y="35" class="n">value_list</text><text x="336" y="35" class="r" text-anchor="end">281 rows</text><text x="26" y="63" class="k">PK</text><text x="54" y="63" class="c">list_name, value</text><text x="54" y="81" class="m">+ 1 more columns</text></g><g><title>Every column of every table: its type, whether it is required, the fixed list or unit it takes, and its meaning.</title><rect x="16" y="108" width="330" height="74" rx="7" class="box"/><path d="M16,136 V115 q0,-7 7,-7 H339 q7,0 7,7 V136 z" class="head"/><text x="26" y="127" class="n">data_dictionary</text><text x="336" y="127" class="r" text-anchor="end">134 rows</text><text x="26" y="155" class="k">PK</text><text x="54" y="155" class="c">table_name, column_name</text><text x="54" y="173" class="m">+ 8 more columns</text></g><g><title>Every unit a rate may be stored in, what it prices per, and how to reach its standard unit: value_std = value x multiplier, or divide by the days of the billed month or year (calendar_factor) for a price per month or year. A unit whose billing period no held document states has neither.</title><rect x="16" y="200" width="330" height="74" rx="7" class="box"/><path d="M16,228 V207 q0,-7 7,-7 H339 q7,0 7,7 V228 z" class="head"/><text x="26" y="219" class="n">unit</text><text x="336" y="219" class="r" text-anchor="end">12 rows</text><text x="26" y="247" class="k">PK</text><text x="54" y="247" class="c">unit</text><text x="54" y="265" class="m">+ 6 more columns</text></g><g><title>The electricity distribution network service providers whose tariffs are stored.</title><rect x="16" y="292" width="330" height="74" rx="7" class="box"/><path d="M16,320 V299 q0,-7 7,-7 H339 q7,0 7,7 V320 z" class="head"/><text x="26" y="311" class="n">distributor</text><text x="336" y="311" class="r" text-anchor="end">14 rows</text><text x="26" y="339" class="k">PK</text><text x="54" y="339" class="c">distributor_id</text><text x="54" y="357" class="m">+ 4 more columns</text></g><g><title>Every document version the rates, TOU windows and criteria are read from, with where it came from. A re-issued document is a new row; no version replaces another.</title><rect x="16" y="384" width="330" height="92" rx="7" class="box"/><path d="M16,412 V391 q0,-7 7,-7 H339 q7,0 7,7 V412 z" class="head"/><text x="26" y="403" class="n">source_document</text><text x="336" y="403" class="r" text-anchor="end">464 rows</text><text x="26" y="431" class="k">PK</text><text x="54" y="431" class="c">document_id</text><text x="26" y="449" class="k" style="fill:#2563eb">FK</text><text x="54" y="449" class="c">distributor_id <tspan class="t">→ distributor</tspan></text><text x="54" y="467" class="m">+ 11 more columns</text></g><g><title>A network tariff code in effect for a period, with its name and customer class as published and whether its rates are provisional (AER) or final (the distributor&#x27;s own list). A tariff with no rate rows is one its document lists with every price zero.</title><rect x="16" y="494" width="330" height="128" rx="7" class="box"/><path d="M16,522 V501 q0,-7 7,-7 H339 q7,0 7,7 V522 z" class="head"/><text x="26" y="513" class="n">tariff</text><text x="336" y="513" class="r" text-anchor="end">6,381 rows</text><text x="26" y="541" class="k">PK</text><text x="54" y="541" class="c">distributor_id, tariff_code,</text><text x="26" y="559" class="k"></text><text x="54" y="559" class="c">effective_from</text><text x="26" y="577" class="k" style="fill:#2563eb">FK</text><text x="54" y="577" class="c">distributor_id <tspan class="t">→ distributor</tspan></text><text x="26" y="595" class="k" style="fill:#d97706">FK</text><text x="54" y="595" class="c">document_id <tspan class="t">→ source_document</tspan></text><text x="54" y="613" class="m">+ 6 more columns</text></g><g><title>Whether a tariff is the default, opt-in, opt-out, mandatory or assigned by the distributor, and for whom the statement says so. A tariff may be the default for one group and opt-in for another; every published statement is kept.</title><rect x="16" y="640" width="330" height="164" rx="7" class="box"/><path d="M16,668 V647 q0,-7 7,-7 H339 q7,0 7,7 V668 z" class="head"/><text x="26" y="659" class="n">tariff_assignment</text><text x="336" y="659" class="r" text-anchor="end">484 rows</text><text x="26" y="687" class="k">PK</text><text x="54" y="687" class="c">distributor_id, tariff_code,</text><text x="26" y="705" class="k"></text><text x="54" y="705" class="c">effective_from, assignment_no</text><text x="26" y="723" class="k" style="fill:#2563eb">FK</text><text x="54" y="723" class="c">distributor_id <tspan class="t">→ distributor</tspan></text><text x="26" y="741" class="k" style="fill:#d97706">FK</text><text x="54" y="741" class="c">document_id <tspan class="t">→ source_document</tspan></text><text x="26" y="759" class="k" style="fill:#059669">FK</text><text x="54" y="759" class="c">distributor_id, tariff_code,</text><text x="26" y="777" class="k" style="fill:#059669"></text><text x="54" y="777" class="c">effective_from <tspan class="t">→ tariff</tspan></text><text x="54" y="795" class="m">+ 4 more columns</text></g><g><title>The network price charged for one component of a tariff: the total network price (no DUoS/TUoS/jurisdictional breakdown), GST exclusive, in a unit of the unit table next to the value as published.</title><rect x="16" y="822" width="330" height="164" rx="7" class="box"/><path d="M16,850 V829 q0,-7 7,-7 H339 q7,0 7,7 V850 z" class="head"/><text x="26" y="841" class="n">rate</text><text x="336" y="841" class="r" text-anchor="end">25,249 rows</text><text x="26" y="869" class="k">PK</text><text x="54" y="869" class="c">rate_id</text><text x="26" y="887" class="k" style="fill:#2563eb">FK</text><text x="54" y="887" class="c">distributor_id <tspan class="t">→ distributor</tspan></text><text x="26" y="905" class="k" style="fill:#7c3aed">FK</text><text x="54" y="905" class="c">unit <tspan class="t">→ unit</tspan></text><text x="26" y="923" class="k" style="fill:#d97706">FK</text><text x="54" y="923" class="c">document_id <tspan class="t">→ source_document</tspan></text><text x="26" y="941" class="k" style="fill:#059669">FK</text><text x="54" y="941" class="c">distributor_id, tariff_code,</text><text x="26" y="959" class="k" style="fill:#059669"></text><text x="54" y="959" class="c">effective_from <tspan class="t">→ tariff</tspan></text><text x="54" y="977" class="m">+ 18 more columns</text></g><g><title>When each time-of-use period applies: day type, start and end time, months. Times are local clock times as the document states them.</title><rect x="16" y="1004" width="330" height="146" rx="7" class="box"/><path d="M16,1032 V1011 q0,-7 7,-7 H339 q7,0 7,7 V1032 z" class="head"/><text x="26" y="1023" class="n">tou_window</text><text x="336" y="1023" class="r" text-anchor="end">19,595 rows</text><text x="26" y="1051" class="k">PK</text><text x="54" y="1051" class="c">window_id</text><text x="26" y="1069" class="k" style="fill:#2563eb">FK</text><text x="54" y="1069" class="c">distributor_id <tspan class="t">→ distributor</tspan></text><text x="26" y="1087" class="k" style="fill:#d97706">FK</text><text x="54" y="1087" class="c">document_id <tspan class="t">→ source_document</tspan></text><text x="26" y="1105" class="k" style="fill:#059669">FK</text><text x="54" y="1105" class="c">distributor_id, tariff_code,</text><text x="26" y="1123" class="k" style="fill:#059669"></text><text x="54" y="1123" class="c">effective_from <tspan class="t">→ tariff</tspan></text><text x="54" y="1141" class="m">+ 13 more columns</text></g><g><title>Who can be on the tariff: customer type, voltage, consumption or demand thresholds, meter type, availability, required technology. How customers are assigned is tariff_assignment.</title><rect x="16" y="1168" width="330" height="146" rx="7" class="box"/><path d="M16,1196 V1175 q0,-7 7,-7 H339 q7,0 7,7 V1196 z" class="head"/><text x="26" y="1187" class="n">eligibility</text><text x="336" y="1187" class="r" text-anchor="end">6,995 rows</text><text x="26" y="1215" class="k">PK</text><text x="54" y="1215" class="c">criterion_id</text><text x="26" y="1233" class="k" style="fill:#2563eb">FK</text><text x="54" y="1233" class="c">distributor_id <tspan class="t">→ distributor</tspan></text><text x="26" y="1251" class="k" style="fill:#d97706">FK</text><text x="54" y="1251" class="c">document_id <tspan class="t">→ source_document</tspan></text><text x="26" y="1269" class="k" style="fill:#059669">FK</text><text x="54" y="1269" class="c">distributor_id, tariff_code,</text><text x="26" y="1287" class="k" style="fill:#059669"></text><text x="54" y="1287" class="c">effective_from <tspan class="t">→ tariff</tspan></text><text x="54" y="1305" class="m">+ 9 more columns</text></g><g><title>How the quantity a demand, capacity or export rate is applied to is measured: in kW or kVA, over which interval, highest or an average of the highest, reset when, with any minimum, threshold or free allowance the document states.</title><rect x="16" y="1332" width="330" height="146" rx="7" class="box"/><path d="M16,1360 V1339 q0,-7 7,-7 H339 q7,0 7,7 V1360 z" class="head"/><text x="26" y="1351" class="n">charge_rule</text><text x="336" y="1351" class="r" text-anchor="end">3,301 rows</text><text x="26" y="1379" class="k">PK</text><text x="54" y="1379" class="c">rule_id</text><text x="26" y="1397" class="k" style="fill:#2563eb">FK</text><text x="54" y="1397" class="c">distributor_id <tspan class="t">→ distributor</tspan></text><text x="26" y="1415" class="k" style="fill:#d97706">FK</text><text x="54" y="1415" class="c">document_id <tspan class="t">→ source_document</tspan></text><text x="26" y="1433" class="k" style="fill:#059669">FK</text><text x="54" y="1433" class="c">distributor_id, tariff_code,</text><text x="26" y="1451" class="k" style="fill:#059669"></text><text x="54" y="1451" class="c">effective_from <tspan class="t">→ tariff</tspan></text><text x="54" y="1469" class="m">+ 16 more columns</text></g><g stroke="#2563eb" fill="#2563eb"><title>references distributor</title><path d="M364,306.0 V1393" class="bus"/><path d="M364,306.0 H354" class="bus"/><path d="M354,301.5 L347,306.0 L354,310.5 z" stroke="none"/><path d="M346,445 H364" class="tick"/><circle cx="364" cy="445" r="3" stroke="none"/><path d="M346,573 H364" class="tick"/><circle cx="364" cy="573" r="3" stroke="none"/><path d="M346,719 H364" class="tick"/><circle cx="364" cy="719" r="3" stroke="none"/><path d="M346,883 H364" class="tick"/><circle cx="364" cy="883" r="3" stroke="none"/><path d="M346,1065 H364" class="tick"/><circle cx="364" cy="1065" r="3" stroke="none"/><path d="M346,1229 H364" class="tick"/><circle cx="364" cy="1229" r="3" stroke="none"/><path d="M346,1393 H364" class="tick"/><circle cx="364" cy="1393" r="3" stroke="none"/></g><g stroke="#d97706" fill="#d97706"><title>references source_document</title><path d="M378,398.0 V1411" class="bus"/><path d="M378,398.0 H354" class="bus"/><path d="M354,393.5 L347,398.0 L354,402.5 z" stroke="none"/><path d="M346,591 H378" class="tick"/><circle cx="378" cy="591" r="3" stroke="none"/><path d="M346,737 H378" class="tick"/><circle cx="378" cy="737" r="3" stroke="none"/><path d="M346,919 H378" class="tick"/><circle cx="378" cy="919" r="3" stroke="none"/><path d="M346,1083 H378" class="tick"/><circle cx="378" cy="1083" r="3" stroke="none"/><path d="M346,1247 H378" class="tick"/><circle cx="378" cy="1247" r="3" stroke="none"/><path d="M346,1411 H378" class="tick"/><circle cx="378" cy="1411" r="3" stroke="none"/></g><g stroke="#059669" fill="#059669"><title>references tariff</title><path d="M392,508.0 V1447" class="bus"/><path d="M392,508.0 H354" class="bus"/><path d="M354,503.5 L347,508.0 L354,512.5 z" stroke="none"/><path d="M346,773 H392" class="tick"/><circle cx="392" cy="773" r="3" stroke="none"/><path d="M346,955 H392" class="tick"/><circle cx="392" cy="955" r="3" stroke="none"/><path d="M346,1119 H392" class="tick"/><circle cx="392" cy="1119" r="3" stroke="none"/><path d="M346,1283 H392" class="tick"/><circle cx="392" cy="1283" r="3" stroke="none"/><path d="M346,1447 H392" class="tick"/><circle cx="392" cy="1447" r="3" stroke="none"/></g><g stroke="#7c3aed" fill="#7c3aed"><title>references unit</title><path d="M406,214.0 V901" class="bus"/><path d="M406,214.0 H354" class="bus"/><path d="M354,209.5 L347,214.0 L354,218.5 z" stroke="none"/><path d="M346,901 H406" class="tick"/><circle cx="406" cy="901" r="3" stroke="none"/></g></svg>
